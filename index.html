<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>REDPRO — Глава 1: Взломщики</title>

<style>
:root{
 --bg:#08090c;
 --panel:#101218;
 --line:#2a2e38;
 --text:#f4f5f7;
 --red:#ff3b30;
 --green:#55d98b;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#08090c;
 color:white;
 font-family:system-ui,Arial;
}

button{
 font:inherit;
 color:white;
}

#app{
 width:100%;
 height:100%;
 max-width:1000px;
 margin:auto;
 position:relative;
 overflow:hidden;
}


.screen{
 position:absolute;
 inset:0;
 display:none;
}

.active{
 display:flex;
}


/* MENU */

#menu{
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle,#1b202c,#08090c 70%);
 padding:20px;
}


.box{
 width:min(500px,100%);
 background:#101218ee;
 border:1px solid #303542;
 border-radius:18px;
 padding:30px;
}


.logo{
 font-size:60px;
 font-weight:900;
 letter-spacing:.1em;
}

.logo span{
 color:#ff3b30;
}


.subtitle{
 color:#999;
 margin-bottom:30px;
}


.btn{
 width:100%;
 padding:15px;
 margin:8px 0;
 border-radius:12px;
 border:1px solid #343945;
 background:#151821;
}


.btn:active{
 transform:scale(.97);
}



/* GAME */

#game{
 background:#050608;
}


#canvas{
 position:absolute;
 width:100%;
 height:100%;
 image-rendering:pixelated;
}



/* HUD */

#hud{
 position:absolute;
 top:10px;
 left:10px;
 right:10px;
 z-index:5;
 display:flex;
 gap:10px;
}


.hud{
 background:#08090ccc;
 border:1px solid #303542;
 padding:10px;
 border-radius:10px;
}


#quest{
 flex:1;
}



/* DIALOG */

#dialog{
 position:absolute;
 bottom:160px;
 left:15px;
 right:15px;
 background:#090a0eef;
 border:1px solid #444;
 border-radius:15px;
 padding:15px;
 display:none;
 z-index:20;
}


#dialog.show{
 display:block;
}


#name{
 color:#ff3b30;
 font-weight:900;
}


#next{
 margin-top:10px;
 padding:10px;
 background:#151821;
 border:1px solid #333;
 border-radius:8px;
}



/* CONTROLS */

#controls{
 position:absolute;
 bottom:15px;
 left:15px;
 right:15px;
 display:flex;
 justify-content:space-between;
 z-index:10;
}


.group{
 display:flex;
 gap:10px;
}


.ctrl{
 width:65px;
 height:65px;
 border-radius:15px;
 background:#151821dd;
 border:1px solid #444;
 font-size:25px;
}


.ctrl:active{
 background:#333;
}



#item{
 position:absolute;
 top:80px;
 right:15px;
 background:#101218;
 border:1px solid #333;
 padding:10px;
 border-radius:10px;
 display:none;
}

</style>

</head>

<body>

<div id="app">


<section id="menu" class="screen active">

<div class="box">

<div class="logo">
RED<span>PRO</span>
</div>

<div class="subtitle">
THE REDPRO STORY
</div>


<h2>
Глава 1: «Взломщики»
</h2>

<p>
Редпро похищен Титанами.
Первый шаг — побег.
</p>


<button class="btn" id="start">
▶ НАЧАТЬ
</button>


</div>

</section>



<section id="game" class="screen">


<div id="hud">

<div class="hud" id="quest">
Квест: Осмотреть камеру
</div>

<div class="hud">
● LIVE
</div>

</div>


<canvas id="canvas"></canvas>


<div id="item">
Получено:
</div>



<div id="dialog">

<div id="name">
РЕДПРО
</div>

<div id="text">
...
</div>

<button id="next">
Продолжить
</button>

</div>



<div id="controls">

<div class="group">

<button class="ctrl" data-key="left">
◀
</button>

<button class="ctrl" data-key="right">
▶
</button>

</div>


<div class="group">

<button class="ctrl" data-key="jump">
▲
</button>


<button class="ctrl" data-key="action">
●
</button>

</div>


</div>


</section>


</div>

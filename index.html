<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Redpro — Игра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Arial, "Helvetica Neue", sans-serif;
    user-select: none;
    background: #2a4a7a;
  }
  
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    display: flex; align-items: center;
    background: #1a2a4a;
    border-bottom: 3px solid #0a1428;
    z-index: 100;
  }
  
  .shop-tab {
    width: 100px; height: 100%;
    background: linear-gradient(180deg, #ffd93d, #e8a000);
    border-right: 3px solid #0a1428;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #5a3a00;
    letter-spacing: 1px; cursor: pointer;
  }
  
  .profile {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; height: 100%;
    border-right: 3px solid #0a1428;
    min-width: 200px;
  }
  
  .avatar {
    width: 48px; height: 48px;
    background: linear-gradient(180deg, #e5231b, #7a0f0a);
    border: 3px solid #f5a800; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900; color: #fff;
  }
  
  .player-name { display: flex; flex-direction: column; line-height: 1.05; }
  .player-name .label { font-size: 10px; color: #7a9ad0; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
  .player-name .value { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
  
  .resources { display: flex; align-items: center; gap: 6px; padding: 0 12px; flex: 1; height: 100%; }
  .res {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 5px;
    background: rgba(0,0,0,0.35);
    border: 2px solid #0a1428; border-radius: 6px;
    height: 40px;
  }
  .res-icon {
    width: 28px; height: 28px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; color: #fff;
    border: 2px solid #fff;
  }
  .res-icon.blue { background: linear-gradient(180deg, #4a9eff, #1a5fbf); }
  .res-icon.green { background: linear-gradient(180deg, #6dff6d, #0fa00f); }
  .res-value { font-size: 15px; font-weight: 900; color: #fff; }
  
  .empty-slots { display: flex; gap: 6px; align-items: center; margin-left: auto; padding-right: 8px; }
  .empty-slot { width: 44px; height: 36px; background: rgba(0,0,0,0.35); border: 2px solid #0a1428; border-radius: 6px; }
  
  .settings-icon {
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #4a9eff, #1a5fbf);
    border: 3px solid #fff; border-radius: 6px;
    margin-right: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer;
    box-shadow: 0 3px 0 #0a3a8a;
    transition: transform 0.1s; color: #fff;
  }
  .settings-icon:active { transform: translateY(3px); box-shadow: 0 0 0 #0a3a8a; }
  
  .sidebar {
    position: fixed;
    top: 64px; left: 0; bottom: 0;
    width: 100px;
    background: #1a2a4a;
    border-right: 3px solid #0a1428;
    display: flex; flex-direction: column;
    z-index: 90;
  }
  
  .side-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 3px solid #0a1428;
    font-size: 14px; font-weight: 900; color: #fff;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; text-align: center;
    padding: 8px 4px; line-height: 1.1;
    transition: filter 0.1s;
  }
  .side-btn:last-child { border-bottom: none; }
  .side-btn:active { filter: brightness(0.8); }
  .side-btn.yellow { background: #ffd93d; color: #5a3a00; }
  .side-btn.darkgray { background: #3a3a3a; }
  .side-btn.blue { background: #4a7dff; }
  .side-btn.dark { background: #2a2a2a; }
  
  .main {
    position: fixed;
    top: 64px; left: 100px; right: 0; bottom: 0;
    padding: 10px;
    display: flex; flex-direction: column;
    gap: 10px; overflow: hidden;
  }
  
  .battle-area {
    display: grid;
    grid-template-columns: 90px 1fr 220px;
    border: 3px solid #0a1428;
    border-radius: 4px; overflow: hidden;
    flex: 1; min-height: 0;
    background: #0a1428;
    box-shadow: 0 6px 0 rgba(0,0,0,0.5);
  }
  
  .modes { display: flex; flex-direction: column; gap: 0; background: #0a1428; }
  
  .mode-btn {
    flex: 1;
    border-bottom: 3px solid #0a1428;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-size: 13px; font-weight: 900; color: #fff;
    cursor: pointer; line-height: 1.1;
    padding: 6px 4px; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .mode-btn:last-child { border-bottom: none; }
  .mode-btn:active { filter: brightness(0.8); }
  .mode-btn.solo { background: linear-gradient(180deg, #b855f7, #7a1fbf); }
  .mode-btn.football { background: linear-gradient(180deg, #4a7dff, #1a3a99); }
  .mode-btn.boss { background: linear-gradient(180deg, #4aa8e8, #1a6fbf); }
  .mode-btn.zone { background: linear-gradient(180deg, #e5231b, #8a0f18); }
  
  .battle-preview {
    background: #d42020;
    border-left: 3px solid #0a1428;
    border-right: 3px solid #0a1428;
  }
  
  .battle-right { display: flex; flex-direction: column; gap: 0; background: #2a2a2a; }
  
  .progress-bar {
    height: 60px; padding: 10px;
    display: flex; align-items: center;
    border-bottom: 3px solid #0a1428;
  }
  .progress-track {
    flex: 1; height: 32px;
    background: #0a1428;
    border: 3px solid #1a2a4a; border-radius: 6px;
    position: relative; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 55%;
    background: linear-gradient(180deg, #5ce4ff, #1a8fbf);
    border-radius: 3px;
  }
  .progress-hex {
    position: absolute; left: 4px; top: 50%;
    transform: translateY(-50%);
    width: 24px; height: 24px;
    background: #5ce4ff; border: 3px solid #0a1428;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 2;
  }
  
  .play-btn {
    flex: 1;
    background: linear-gradient(180deg, #ffd93d, #e8a000);
    border-bottom: 3px solid #0a1428;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; color: #5a3a00;
    cursor: pointer; letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .play-btn:active { filter: brightness(0.85); }
  
  .team-btn {
    height: 50px;
    background: linear-gradient(180deg, #4aa8e8, #1a6fbf);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #fff;
    cursor: pointer; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .team-btn:active { filter: brightness(0.85); }
  
  .bottom-panels {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1fr;
    gap: 10px; height: 90px; flex-shrink: 0;
  }
  .panel {
    border: 3px solid #0a1428;
    border-radius: 4px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 900; color: #fff;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer;
  }
  .panel:active { transform: translateY(3px); filter: brightness(0.85); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  .panel.blue { background: linear-gradient(180deg, #4a7dff, #1a3a99); }
  .panel.yellow { background: linear-gradient(180deg, #ffd93d, #e8a000); color: #5a3a00; }
  .panel.darkblue { background: linear-gradient(180deg, #3a6fd0, #1a4a99); }
  
  .right-decor {
    position: fixed; right: -40px; top: 40%;
    width: 100px; height: 200px;
    background: linear-gradient(180deg, #4a9eff, #1a5fbf);
    clip-path: polygon(100% 0%, 100% 100%, 0% 90%, 0% 10%);
    z-index: 80; border: 3px solid #0a1428;
  }
  
  /* ============ ЭКРАН БОЙЦОВ ============ */
  .screen {
    position: fixed;
    top: 64px; left: 100px; right: 0; bottom: 0;
    background: #2a6fbf;
    display: none;
    flex-direction: column;
    z-index: 95;
    overflow: hidden;
  }
  .screen.active { display: flex; }
  
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(100,180,255,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(60,140,220,0.2) 0%, transparent 50%);
    pointer-events: none;
  }
  
  .screen-header {
    display: flex; align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #1a2a4a, #0f1a33);
    border-bottom: 3px solid #0a1428;
    position: relative; z-index: 2;
    flex-shrink: 0;
  }
  
  .back-btn {
    width: 44px; height: 44px;
    background: linear-gradient(180deg, #ffb800, #e08a00);
    border: 3px solid #fff; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #5a3a00;
    cursor: pointer;
    box-shadow: 0 3px 0 #8a5400;
  }
  .back-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #8a5400; }
  
  .screen-title {
    font-size: 22px; font-weight: 900; color: #fff;
    letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  
  .sort-label {
    margin-left: auto;
    font-size: 12px; color: #ffd93d;
    font-weight: 700; letter-spacing: 0.5px;
    padding: 6px 10px;
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(255,217,61,0.5);
    border-radius: 4px;
  }
  
  .brawlers-list {
    flex: 1; overflow-y: auto;
    padding: 12px;
    display: flex; flex-direction: column;
    gap: 12px;
    position: relative; z-index: 2;
  }
  
  /* КАРТОЧКА БОЙЦА */
  .brawler-card {
    display: grid;
    grid-template-columns: 1fr 70px;
    height: 110px;
    border: 4px solid #0a1428;
    border-radius: 8px;
    background: #1a2a4a;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    transition: transform 0.15s;
  }
  .brawler-card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  
  /* Портрет-фон */
  .brawler-portrait {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #2ad4c0, #1aa899);
  }
  
  /* SVG-лицо Волта на весь блок */
  .volt-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  
  /* Имя поверх портрета (как в Brawl Stars) */
  .brawler-name-overlay {
    position: absolute;
    right: 8px;
    bottom: 30px;
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    font-style: italic;
    text-shadow: 
      2px 2px 0 #0a1428,
      -1px -1px 0 #0a1428,
      1px -1px 0 #0a1428,
      -1px 1px 0 #0a1428;
    transform: rotate(-4deg);
    z-index: 5;
    pointer-events: none;
  }
  
  /* Полоса редкости справа */
  .brawler-rarity {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 0;
    background: linear-gradient(180deg, #b855f7, #7a1fbf);
    position: relative;
  }
  
  .level-badge {
    width: 40px; height: 40px;
    background: radial-gradient(circle, #e5231b 0%, #8a0f18 100%);
    border: 3px solid #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  
  .rarity-gems { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  
  .gem {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3);
  }
  .gem.green { background: radial-gradient(circle at 30% 30%, #a0ffa0, #0fa00f); border-radius: 5px; }
  .gem.yellow { background: radial-gradient(circle at 30% 30%, #fff0a0, #d4960a); border-radius: 5px; }
  .gem.pink { background: radial-gradient(circle at 30% 30%, #ffa0e0, #bf1f7f); border-radius: 50%; }
  
  /* Низ карточки — кубок */
  .brawler-footer {
    position: absolute;
    left: 0; right: 70px; bottom: 0;
    height: 32px;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    border-top: 2px solid rgba(255,255,255,0.15);
    z-index: 6;
  }
  
  .trophy {
    display: flex; align-items: center; gap: 4px;
    color: #fff; font-size: 14px; font-weight: 900;
  }
  .trophy-cup {
    width: 22px; height: 22px;
    background: linear-gradient(180deg, #a0522d, #6b3410);
    border: 2px solid #e8c890;
    border-radius: 3px 3px 8px 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #ffd93d;
  }
  
  /* Пустые слоты */
  .brawler-card.empty {
    opacity: 0.35;
    cursor: default;
    background: rgba(10,20,40,0.5);
    border-style: dashed;
  }
  .brawler-card.empty:active { transform: none; }
  .brawler-card.empty .brawler-portrait { background: rgba(0,0,0,0.3); }
  .brawler-card.empty .brawler-rarity { background: rgba(0,0,0,0.3); }
  
  .empty-mark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    color: rgba(255,255,255,0.3);
    font-weight: 900;
  }
  
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 700; font-size: 14px;
    border: 3px solid #4a9eff;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="shop-tab" onclick="toast('Магазин')">Shop</div>
    <div class="profile">
      <div class="avatar">R</div>
      <div class="player-name">
        <div class="label">Имя</div>
        <div class="value">REDPRO</div>
      </div>
    </div>
    <div class="resources">
      <div class="res">
        <div class="res-icon blue">📖</div>
        <div class="res-value">0</div>
      </div>
      <div class="res">
        <div class="res-icon green">●</div>
        <div class="res-value">0</div>
      </div>
    </div>
    <div class="empty-slots">
      <div class="empty-slot"></div>
      <div class="empty-slot"></div>
      <div class="empty-slot"></div>
    </div>
    <div class="settings-icon" onclick="toast('Настройки')">⚙</div>
  </div>

  <div class="sidebar">
    <div class="side-btn yellow" onclick="toast('Магазин')">Shop</div>
    <div class="side-btn darkgray" onclick="openBrawlers()">Бойцы</div>
    <div class="side-btn blue" onclick="toast('Бой')">Бой</div>
    <div class="side-btn dark" onclick="toast('Клан')">Клан</div>
  </div>

  <div class="right-decor"></div>

  <div class="main" id="lobby">
    <div class="battle-area">
      <div class="modes">
        <div class="mode-btn solo" onclick="selectMode(this, 'Соло ШД')">СОЛО-<br>ШД</div>
        <div class="mode-btn football" onclick="selectMode(this, 'Футбол')">ФУТ-<br>БОЛ</div>
        <div class="mode-btn boss" onclick="selectMode(this, 'Босс')">БОСС</div>
        <div class="mode-btn zone" onclick="selectMode(this, 'Захват зоны')">ЗАХ-<br>ВАТ<br>ЗОНЫ</div>
      </div>
      <div class="battle-preview"></div>
      <div class="battle-right">
        <div class="progress-bar">
          <div class="progress-track">
            <div class="progress-hex"></div>
            <div class="progress-fill"></div>
          </div>
        </div>
        <div class="play-btn" onclick="startGame()">PLAY</div>
        <div class="team-btn" onclick="toast('Команда')">КОМАНДА</div>
      </div>
    </div>
    <div class="bottom-panels">
      <div class="panel blue" onclick="toast('Скоро')">Панель 1</div>
      <div class="panel yellow" onclick="toast('Скоро')">Панель 2</div>
      <div class="panel darkblue" onclick="toast('Скоро')">Панель 3</div>
    </div>
  </div>

  <!-- ЭКРАН БОЙЦОВ -->
  <div class="screen" id="brawlersScreen">
    <div class="screen-header">
      <div class="back-btn" onclick="closeBrawlers()">←</div>
      <div class="screen-title">БОЙЦЫ</div>
      <div class="sort-label">Сначала менее редкие</div>
    </div>
    
    <div class="brawlers-list">
      
      <!-- ВОЛТ -->
      <div class="brawler-card" onclick="toast('Волт — выбран')">
        <div class="brawler-portrait">
          <!-- Крупное лицо Волта -->
          <svg class="volt-svg" viewBox="0 0 300 110" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f5d0b0"/>
                <stop offset="100%" stop-color="#e5b080"/>
              </linearGradient>
              <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a4522"/>
                <stop offset="100%" stop-color="#3a2010"/>
              </linearGradient>
              <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#d0d0d0"/>
              </linearGradient>
              <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2a2a2a"/>
                <stop offset="100%" stop-color="#0a0a0a"/>
              </linearGradient>
            </defs>
            
            <!-- Фон — бирюзовый -->
            <rect width="300" height="110" fill="#2ad4c0"/>
            
            <!-- Плечи (чёрная куртка) -->
            <path d="M 0 110 Q 30 80 80 78 L 220 78 Q 270 80 300 110 Z" fill="url(#shirtGrad)"/>
            
            <!-- Открытая грудь -->
            <path d="M 120 80 L 150 100 L 180 80 Z" fill="url(#skinGrad)"/>
            
            <!-- Шея -->
            <rect x="130" y="60" width="40" height="25" fill="url(#skinGrad)"/>
            
            <!-- Волосы сзади -->
            <path d="M 70 70 Q 65 20 150 15 Q 235 20 230 70 L 230 90 L 70 90 Z" fill="url(#hairGrad)"/>
            
            <!-- Лицо (крупное) -->
            <path d="M 90 55 Q 90 25 150 25 Q 210 25 210 55 L 210 80 Q 210 105 150 105 Q 90 105 90 80 Z" fill="url(#skinGrad)"/>
            
            <!-- Ухо левое -->
            <ellipse cx="88" cy="65" rx="8" ry="12" fill="#e5b080"/>
            <!-- Ухо правое -->
            <ellipse cx="212" cy="65" rx="8" ry="12" fill="#e5b080"/>
            
            <!-- Кепка белая -->
            <path d="M 75 55 Q 100 20 150 18 Q 200 20 225 55 L 225 62 Q 150 45 75 62 Z" fill="url(#hatGrad)" stroke="#a8a8a8" stroke-width="1.5"/>
            
            <!-- Оранжевая полоса на кепке -->
            <path d="M 75 58 Q 150 42 225 58 L 225 63 Q 150 47 75 63 Z" fill="#f5a800"/>
            
            <!-- Козырёк кепки (вбок, как в Brawl Stars) -->
            <path d="M 130 62 Q 200 60 250 75 Q 245 88 200 85 Q 160 80 130 70 Z" fill="url(#hatGrad)" stroke="#a8a8a8" stroke-width="1.5"/>
            
            <!-- Брови сердитые -->
            <path d="M 105 60 L 140 65" stroke="#3a2010" stroke-width="4" stroke-linecap="round"/>
            <path d="M 195 60 L 160 65" stroke="#3a2010" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Глаза -->
            <ellipse cx="125" cy="75" rx="12" ry="11" fill="#fff"/>
            <ellipse cx="175" cy="75" rx="12" ry="11" fill="#fff"/>
            <circle cx="127" cy="76" r="6" fill="#1a1a1a"/>
            <circle cx="173" cy="76" r="6" fill="#1a1a1a"/>
            <circle cx="125" cy="73" r="2" fill="#fff"/>
            <circle cx="171" cy="73" r="2" fill="#fff"/>

<script>
  let currentMode = 'Соло ШД';
  
  function selectMode(el, mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.style.outline = 'none');
    el.style.outline = '4px solid #ffd93d';
    el.style.outlineOffset = '-4px';
    currentMode = mode;
    toast('Режим: ' + mode);
  }
  
  function startGame() { toast('Запуск: ' + currentMode); }
  function openBrawlers() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('brawlersScreen').classList.add('active');
  }
  function closeBrawlers() {
    document.getElementById('brawlersScreen').classList.remove('active');
    document.getElementById('lobby').style.display = 'flex';
  }
  
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
</script>

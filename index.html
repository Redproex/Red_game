<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redpro Archives</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#050d18;
    color:white;
    overflow:hidden;
}


/* ВЕРХНЯЯ ПАНЕЛЬ */

.top-hud{
    height:80px;
    background:#10243c;
    border-bottom:4px solid #02070d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
}


.profile{
    display:flex;
    align-items:center;
    gap:15px;
}


.avatar{
    width:55px;
    height:55px;
    background:#800000;
    border:3px solid #ff2525;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}


.profile span{
    display:block;
    font-size:22px;
}

.profile small{
    color:#00c8ff;
}


.resources{
    display:flex;
    gap:15px;
}


.resource{
    background:#193452;
    border:2px solid #07101c;
    padding:12px 25px;
    clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);
}


.settings{
    width:55px;
    height:55px;
    background:#167bd8;
    color:white;
    font-size:30px;
    border:3px solid #02070d;
}


/* ОСНОВА */


.game{
    display:flex;
    height:calc(100vh - 80px);
}


/* ЛЕВО */


.menu{
    width:200px;
    background:#0c1c30;
    padding:15px;
}


.menu button{

    width:100%;
    height:65px;
    margin-bottom:10px;

    background:#193653;
    color:white;

    border:none;
    border-left:6px solid #16b8ff;

    font-size:18px;

    clip-path:
    polygon(0 0,100% 0,90% 100%,0 100%);
}


.menu button:hover,
.menu .active{

    background:#b8202c;
    border-left-color:#ffbf24;
}


/* ЦЕНТР */


.center{

    flex:1;
    padding:20px;

}


.screen{

    height:70%;
    background:

    linear-gradient(
    145deg,
    #152d4a,
    #071321
    );

    border:5px solid #02070d;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    overflow:hidden;
}


.screen:before{

content:"";

position:absolute;
inset:0;

background:
radial-gradient(circle,
#16b8ff33,
transparent 60%);

}


.character{

z-index:2;

text-align:center;

}


.character h1{

font-size:55px;

color:#ff3030;

text-shadow:
0 0 15px red;

}


.info{

background:#10243c;

padding:15px;

border:2px solid #16b8ff;

}



/* ПРАВО */


.right{

width:300px;

background:#0b1728;

padding:20px;

}


.hp{

height:30px;

background:#1c3857;

border:3px solid black;

margin-bottom:30px;

}


.hp div{

height:100%;

width:70%;

background:#16d8ff;

}



.play{

width:100%;

height:100px;

background:#ffbd22;

border:5px solid #111;

font-size:45px;

font-weight:bold;

}


.team{

margin-top:15px;

width:100%;

height:60px;

background:#168de0;

border:4px solid #06101c;

font-size:25px;

color:white;

}



/* НИЗ */


.bottom{

position:absolute;

bottom:20px;

left:220px;

right:330px;

display:flex;

gap:20px;

}


.card{

flex:1;

height:120px;

background:#132b47;

border:4px solid #02070d;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

}


.card:hover{

border-color:#16b8ff;

transform:translateY(-5px);

}



/* СКАНИРОВАНИЕ */

.scan{

position:absolute;

inset:0;

background:
linear-gradient(
transparent 50%,
#16b8ff11 50%
);

background-size:100% 8px;

pointer-events:none;

}

</style>

</head>


<body>


<header class="top-hud">


<div class="profile">

<div class="avatar">
RP
</div>

<div>

<span>REDPRO</span>
<small>Архивариус</small>

</div>

</div>



<div class="resources">

<div class="resource">
⚡ 250
</div>

<div class="resource">
◈ 1200
</div>

<div class="resource">
◆ 50
</div>

</div>


<button class="settings">
⚙
</button>


</header>





<div class="game">



<div class="menu">

<button class="active">
📁 АРХИВ
</button>

<button>
👤 СОЮЗНИКИ
</button>

<button>
⚔ ФРАКЦИИ
</button>

<button>
☠ БОССЫ
</button>

<button>
🌌 ЗОНЫ
</button>

</div>






<div class="center">


<div class="screen">

<div class="character">

<h1>
GOLD CHILD
</h1>


<div class="info">

WORLD: 1110<br>
SECTOR: 14<br>
STATUS: UNKNOWN

</div>


</div>


<div class="scan"></div>


</div>



</div>






<div class="right">


<div class="hp">

<div></div>

</div>


<button class="play">
PLAY
</button>


<button class="team">
КОМАНДА
</button>



</div>



</div>





<div class="bottom">

<div class="card">
🛡 ГЕРОИ
</div>

<div class="card">
⚔ АРСЕНАЛ
</div>

<div class="card">
📚 АРХИВ
</div>

</div>



</body>
</html>

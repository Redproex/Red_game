<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Redpro — Игра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1b3d;
    user-select: none;
  }
  
  /* ============ ФОН ============ */
  body {
    background: 
      radial-gradient(circle at 20% 30%, rgba(50, 100, 200, 0.3), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(150, 30, 30, 0.2), transparent 40%),
      linear-gradient(180deg, #16295a 0%, #0d1b3d 100%);
  }
  
  /* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: rgba(10, 20, 50, 0.85);
    backdrop-filter: blur(6px);
    z-index: 100;
    border-bottom: 2px solid #0a1428;
  }
  
  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-right: 16px;
    border-right: 2px solid rgba(255,255,255,0.15);
  }
  
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle, #e5231b, #7a0f0a);
    border: 3px solid #f5a800;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 0 10px rgba(245, 168, 0, 0.6);
  }
  
  .player-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  
  .player-name .label {
    font-size: 10px;
    color: #6a89c7;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  
  .player-name .value {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    letter-spacing: 1px;
  }
  
  /* Ресурсы */
  .resources {
    display: flex;
    gap: 8px;
    margin-left: auto;
    margin-right: 12px;
  }
  
  .res {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px 6px 6px;
    background: rgba(0,0,0,0.4);
    border-radius: 20px;
    border: 2px solid rgba(100,150,255,0.3);
  }
  
  .res-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    color: #fff;
  }
  
  .res-icon.red { background: linear-gradient(180deg, #ff4757, #c4172a); border: 2px solid #fff; }
  .res-icon.gold { background: linear-gradient(180deg, #ffd93d, #d4960a); border: 2px solid #fff; color: #5a3a00; }
  .res-icon.green { background: linear-gradient(180deg, #6dff6d, #0fa00f); border: 2px solid #fff; }
  
  .res-value {
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  
  /* Настройки */
  .settings-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: linear-gradient(180deg, #4a7dff, #2b5cff);
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1a3a99;
    transition: transform 0.15s;
  }
  .settings-icon:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a3a99; }
  
  /* ============ ЛЕВОЕ МЕНЮ ============ */
  .sidebar {
    position: fixed;
    top: 60px; left: 0; bottom: 0;
    width: 90px;
    background: rgba(10, 20, 50, 0.9);
    border-right: 2px solid #0a1428;
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
    gap: 10px;
    z-index: 90;
    overflow-y: auto;
  }
  
  .side-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 4px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
    border: 3px solid #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    min-height: 72px;
  }
  
  .side-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  
  .side-btn.shop { background: linear-gradient(180deg, #ffb800, #e08a00); }
  .side-btn.brawlers { background: linear-gradient(180deg, #4a7dff, #2b5cff); }
  .side-btn.battle { background: linear-gradient(180deg, #ff4757, #c4172a); }
  .side-btn.band { background: linear-gradient(180deg, #a855f7, #7a1fbf); }
  .side-btn.friends { background: linear-gradient(180deg, #22c55e, #0f8a3a); }
  
  .side-icon {
    font-size: 26px;
    line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  
  .side-label {
    font-size: 10px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }
  
  .badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 22px; height: 22px;
    padding: 0 5px;
    background: #e5231b;
    border: 2px solid #fff;
    border-radius: 11px;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* ============ ГЛАВНАЯ ОБЛАСТЬ ============ */
  .main {
    position: fixed;
    top: 60px;
    left: 90px;
    right: 0;
    bottom: 0;
    padding: 12px;
    overflow-y: auto;
  }
  
  /* Красная панель боя */
  .battle-panel {
    background: linear-gradient(180deg, #b8202a, #8a0f18);
    border: 4px solid #fff;
    border-radius: 14px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.2);
    display: flex;
    min-height: 220px;
    overflow: hidden;
    position: relative;
  }
  
  /* Режимы (слева от панели) */
  .modes {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px;
    background: rgba(0,0,0,0.25);
    border-right: 3px solid rgba(255,255,255,0.2);
    min-width: 78px;
  }
  
  .mode-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s;
    line-height: 1.15;
    position: relative;
  }
  
  .mode-btn:active { transform: scale(0.96); }
  
  .mode-btn.solo { background: linear-gradient(180deg, #a855f7, #6a1fbf); }
  .mode-btn.football { background: linear-gradient(180deg, #4a7dff, #1a3a99); }
  .mode-btn.boss { background: linear-gradient(180deg, #38a5e8, #1a5f99); }
  .mode-btn.zone { background: linear-gradient(180deg, #e5231b, #8a0f18); }
  
  .mode-btn.active {
    box-shadow: 0 0 0 3px #f5a800, 0 0 12px #f5a800;
    z-index: 2;
  }
  
  /* Превью боя */
  .battle-preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    padding: 20px;
    position: relative;
  }
  
  .battle-preview::before {
    content: 'ПОЛЕ БОЯ';
    position: absolute;
    font-size: 22px;
    letter-spacing: 6px;
    opacity: 0.35;
    transform: rotate(-8deg);
  }
  
  /* Правая колонка с PLAY */
  .battle-right {
    background: rgba(0,0,0,0.35);
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-left: 3px solid rgba(255,255,255,0.2);
    min-width: 130px;
  }
  
  .progress-bar {
    height: 24px;
    background: rgba(0,0,0,0.5);
    border: 3px solid #fff;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  
  .progress-fill {
    height: 100%;
    width: 45%;
    background: linear-gradient(180deg, #7cf5d6, #00b8a4);
    border-radius: 9px;
    position: relative;
  }
  
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 2px; left: 6px; right: 6px;
    height: 30%;
    background: rgba(255,255,255,0.4);
    border-radius: 4px;
  }
  
  .progress-icon {
    position: absolute;
    left: 2px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #38a5e8;
    border: 2px solid #fff;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  
  .play-btn {
    flex: 1;
    background: linear-gradient(180deg, #ffd93d, #e8a000);
    border: 3px solid #fff;
    border-radius: 12px;
    box-shadow: 0 5px 0 #996a00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 900;
    color: #5a3a00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    letter-spacing: 3px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    min-height: 70px;
  }
  
  .play-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #996a00; }
  
  .team-btn {
    background: linear-gradient(180deg, #38a5e8, #1a5f99);
    border: 3px solid #fff;
    border-radius: 12px;
    box-shadow: 0 4px 0 #0d3a66;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  
  .team-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d3a66; }
  
  /* ============ НИЖНИЕ ПАНЕЛИ ============ */
  .bottom-panels {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  
  .panel {
    background: linear-gradient(180deg, #4a7dff, #1a3a99);
    border: 3px solid #fff;
    border-radius: 12px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  
  .panel:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  
  .panel.gold {
    background: linear-gradient(180deg, #ffb800, #e08a00);
    color: #5a3a00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  
  /* ============ УВЕДОМЛЕНИЕ ============ */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 14px 28px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    border: 2px solid rgba(255,255,255,0.2);
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
    pointer-events: none;
  }
  
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div class="topbar">
    <div class="profile">
      <div class="avatar">R</div>
      <div class="player-name">
        <div class="label">Имя</div>
        <div class="value">Redpro</div>
      </div>
    </div>
    
    <div class="resources">
      <div class="res">
        <div class="res-icon red">!</div>
        <div class="res-value" id="res1">0</div>
      </div>
      <div class="res">
        <div class="res-icon gold">★</div>
        <div class="res-value" id="res2">0</div>
      </div>
      <div class="res">
        <div class="res-icon green">◆</div>
        <div class="res-value" id="res3">0</div>
      </div>
    </div>
    
    <div class="settings-icon" onclick="toast('Настройки скоро')">⚙</div>
  </div>

  <!-- ЛЕВОЕ МЕНЮ -->
  <div class="sidebar">
    <div class="side-btn shop" onclick="toast('Магазин скоро')">
      <div class="side-icon">🛒</div>
      <div class="side-label">Магазин</div>
    </div>
    <div class="side-btn brawlers" onclick="toast('Бойцы скоро')">
      <div class="side-icon">🎭</div>
      <div class="side-label">Бойцы</div>
      <div class="badge">1</div>
    </div>
    <div class="side-btn battle" onclick="toast('Ты уже здесь')">
      <div class="side-icon">⚔</div>
      <div class="side-label">Бой</div>
      <div class="badge">1</div>
    </div>
    <div class="side-btn band" onclick="toast('Клан скоро')">
      <div class="side-icon">🛡</div>
      <div class="side-label">Клан</div>
    </div>
    <div class="side-btn friends" onclick="toast('Друзья скоро')">
      <div class="side-icon">👥</div>
      <div class="side-label">Друзья</div>
    </div>
  </div>

  <!-- ГЛАВНАЯ -->
  <div class="main">
    
    <!-- Красная панель боя -->
    <div class="battle-panel">
      
      <!-- Режимы -->
      <div class="modes">
        <div class="mode-btn solo active" onclick="selectMode(this, 'Соло ШД')">СОЛО ШД</div>
        <div class="mode-btn football" onclick="selectMode(this, 'Футбол')">ФУТБОЛ</div>
        <div class="mode-btn boss" onclick="selectMode(this, 'Босс')">БОСС</div>
        <div class="mode-btn zone" onclick="selectMode(this, 'Захват зоны')">ЗАХВАТ<br>ЗОНЫ</div>
      </div>
      
      <!-- Превью -->
      <div class="battle-preview"></div>
      
      <!-- PLAY справа -->
      <div class="battle-right">
        <div class="progress-bar">
          <div class="progress-icon">⬡</div>
          <div class="progress-fill"></div>
        </div>
        <div class="play-btn" onclick="startGame()">PLAY</div>
        <div class="team-btn" onclick="toast('Создание команды скоро')">КОМАНДА</div>
      </div>
      
    </div>
    
    <!-- Нижние панели -->
    <div class="bottom-panels">
      <div class="panel" onclick="toast('Награды лиги скоро')">Лига</div>
      <div class="panel gold" onclick="toast('Ящики скоро')">Ящик</div>
      <div class="panel" onclick="toast('Ещё скоро')">Ещё</div>
    </div>
    
  </div>

  <!-- Уведомление -->
  <div class="toast" id="toast"></div>

<script>
  let currentMode = 'Соло ШД';
  
  function selectMode(el, mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentMode = mode;
    toast('Выбран режим: ' + mode);
  }
  
  function startGame() {
    toast('Запуск: ' + currentMode + ' — скоро!');
  }
  
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>

</body>
</html>

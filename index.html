<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#050609">

<title>The Redpro Archives — Game</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#050609;
color:white;
font-family:Arial,Helvetica,sans-serif;
touch-action:none;
}

#game{
position:relative;
width:100%;
height:100%;
overflow:hidden;
background:#050609;
}

/* =========================
   3D СЦЕНА
========================= */

#scene{
position:absolute;
inset:0;
overflow:hidden;

perspective:900px;

background:
radial-gradient(
ellipse at center,
rgba(80,84,98,.18),
transparent 45%
),
#050609;
}

.world{
position:absolute;
left:50%;
top:50%;

width:1000px;
height:700px;

transform-style:preserve-3d;

transform:
translate(-50%,-50%)
rotateX(0deg)
rotateY(0deg);
}

/* пол */

.floor{
position:absolute;

left:-500px;
top:0;

width:1000px;
height:3000px;

background:
repeating-linear-gradient(
90deg,
rgba(255,255,255,.025) 0 2px,
transparent 2px 100px
),
repeating-linear-gradient(
0deg,
rgba(255,255,255,.018) 0 2px,
transparent 2px 100px
),
linear-gradient(
180deg,
#171920,
#07080b
);

transform:
rotateX(90deg)
translateZ(-350px);

transform-origin:center top;
}

/* потолок */

.ceiling{
position:absolute;

left:-500px;
top:0;

width:1000px;
height:3000px;

background:
linear-gradient(
180deg,
#020305,
#11131a
);

transform:
rotateX(-90deg)
translateZ(-350px);

transform-origin:center top;
}

/* стены */

.wall{
position:absolute;

top:-350px;

width:30px;
height:700px;

background:
linear-gradient(
90deg,
#030407,
#20232c,
#090a0e
);

box-shadow:
0 0 35px rgba(0,0,0,.8);
}

.wall.left{
left:-500px;
transform:
translateZ(-1500px);
}

.wall.right{
right:-500px;
transform:
translateZ(-1500px);
}

/* задняя дверь */

.door{
position:absolute;

width:190px;
height:340px;

left:50%;
top:50%;

margin-left:-95px;
margin-top:-170px;

background:
linear-gradient(
90deg,
#07080c,
#252832,
#08090d
);

border:5px solid #343844;

box-shadow:
0 0 50px rgba(0,0,0,.95),
inset 0 0 35px #000;

transform:
translateZ(-1200px);

transition:
transform .7s ease,
opacity .7s ease;
}

.door::before{
content:"";

position:absolute;

left:18px;
right:18px;
top:20px;
bottom:20px;

border:1px solid #505562;
}

.door-label{
position:absolute;

top:42px;
left:50%;

transform:translateX(-50%);

width:130px;

padding:9px 4px;

text-align:center;

font-size:11px;

letter-spacing:3px;

color:#c9ccd4;

border:1px solid #555b68;

background:#0b0c10;
}

.handle{
position:absolute;

right:18px;
top:50%;

width:9px;
height:48px;

border-radius:5px;

background:#777c88;
}

/* свет в конце коридора */

.light{
position:absolute;

width:280px;
height:30px;

left:50%;
top:50%;

margin-left:-140px;
margin-top:-300px;

background:#bfc5d2;

box-shadow:
0 0 30px #cbd0da,
0 0 100px rgba(190,198,215,.25);

transform:
translateZ(-900px);
}

/* =========================
   ФОНАРИК
========================= */

#flashlight{
position:absolute;
inset:0;

pointer-events:none;

background:
radial-gradient(
ellipse 35% 45% at 50% 48%,
transparent 0%,
rgba(0,0,0,.08) 30%,
rgba(0,0,0,.72) 72%,
rgba(0,0,0,.95) 100%
);

z-index:5;

transition:.25s;
}

.light-off{
background:
rgba(0,0,0,.9)!important;
}

/* =========================
   HUD
========================= */

#hud{
position:absolute;
inset:0;

z-index:10;

pointer-events:none;
}

.top{
position:absolute;

top:
calc(18px + env(safe-area-inset-top));

left:18px;
right:18px;

display:flex;
justify-content:space-between;

font-size:12px;

letter-spacing:1px;

color:#c7cad2;

text-shadow:
0 1px 5px #000;
}

.crosshair{
position:absolute;

left:50%;
top:50%;

width:18px;
height:18px;

transform:
translate(-50%,-50%);
}

.crosshair::before,
.crosshair::after{
content:"";

position:absolute;

background:
rgba(255,255,255,.8);
}

.crosshair::before{
left:8px;
top:0;

width:2px;
height:18px;
}

.crosshair::after{
left:0;
top:8px;

width:18px;
height:2px;
}

/* =========================
   СООБЩЕНИЕ
========================= */

.message{
position:absolute;

left:50%;

bottom:155px;

transform:
translateX(-50%);

width:90%;
max-width:500px;

padding:12px 16px;

text-align:center;

font-size:13px;

line-height:1.5;

color:#d6d8de;

background:
rgba(4,5,8,.78);

border:
1px solid rgba(255,255,255,.13);

backdrop-filter:
blur(5px);

opacity:0;

transition:.25s;
}

.message.show{
opacity:1;
}

/* =========================
   УПРАВЛЕНИЕ
========================= */

.controls{
position:absolute;

left:20px;

bottom:
calc(24px + env(safe-area-inset-bottom));

display:grid;

grid-template-columns:
58px 58px 58px;

grid-template-rows:
58px 58px;

gap:7px;

pointer-events:auto;
}

.btn{
width:58px;
height:58px;

border-radius:14px;

border:
1px solid rgba(255,255,255,.18);

background:
rgba(10,11,15,.76);

color:#e8e9ed;

display:flex;

align-items:center;
justify-content:center;

font-size:21px;

user-select:none;

touch-action:none;

transition:.08s;
}

.btn:active{
background:
rgba(70,73,84,.85);

transform:scale(.94);
}

.up{
grid-column:2;
}

.left{
grid-column:1;
grid-row:2;
}

.down{
grid-column:2;
grid-row:2;
}

.right{
grid-column:3;
grid-row:2;
}

/* =========================
   ДЕЙСТВИЯ
========================= */

.actions{
position:absolute;

right:20px;

bottom:
calc(24px + env(safe-area-inset-bottom));

display:flex;

gap:10px;

pointer-events:auto;
}

.action{
width:68px;
height:68px;

border-radius:50%;

border:
1px solid rgba(255,255,255,.2);

background:
rgba(10,11,15,.8);

color:white;

display:flex;

align-items:center;
justify-content:center;

font-size:11px;

text-align:center;

user-select:none;

touch-action:none;
}

.action:active{
transform:scale(.93);

background:#292c35;
}

/* =========================
   ОРУЖИЕ
========================= */

.weapon{
position:absolute;

right:25px;

bottom:112px;

font-size:11px;

letter-spacing:1px;

color:#aeb2bb;
}

/* =========================
   СТАРТ
========================= */

#start{
position:absolute;

inset:0;

z-index:100;

display:flex;

align-items:center;
justify-content:center;

background:
radial-gradient(
circle,
rgba(30,32,40,.4),
#030407 70%
);
}

.start-box{
width:min(90%,420px);

padding:30px;

text-align:center;

border:
1px solid #292d36;

background:
rgba(7,8,11,.93);

box-shadow:
0 20px 80px #000;
}

.start-box h1{
margin:0 0 8px;

font-size:25px;

letter-spacing:3px;
}

.start-box p{
color:#8f939d;

font-size:13px;

line-height:1.6;
}

.start-button{
margin-top:18px;

width:100%;

padding:15px;

border:
1px solid #444a57;

background:#171a21;

color:white;

border-radius:8px;

font-size:15px;
}

/* =========================
   УПРАВЛЕНИЕ ВЗГЛЯДОМ
========================= */

#lookArea{
position:absolute;

inset:0;

z-index:4;

pointer-events:auto;
}

#lookHint{
position:absolute;

left:50%;
top:58%;

transform:
translate(-50%,-50%);

font-size:11px;

letter-spacing:1px;

color:rgba(255,255,255,.35);

pointer-events:none;

transition:opacity 1s;
}

.hide{
opacity:0!important;
}

</style>
</head>

<body>

<div id="game">

<!-- ================= SCENE ================= -->

<div id="scene">

<div
class="world"
id="world">

<div class="floor"></div>

<div class="ceiling"></div>

<div class="wall left"></div>

<div class="wall right"></div>

<div class="light"></div>

<div
class="door"
id="door">

<div class="door-label">
SECTOR 01
</div>

<div class="handle"></div>

</div>

</div>

</div>

<!-- управление взглядом -->

<div id="lookArea"></div>

<div id="lookHint">
Проведи пальцем по экрану, чтобы осмотреться
</div>

<!-- фонарик -->

<div id="flashlight"></div>

<!-- ================= HUD ================= -->

<div id="hud">

<div class="top">

<div>
REDPRO ARCHIVES
</div>

<div>
HP 100
</div>

</div>

<div class="crosshair"></div>

<div
class="message"
id="message">
</div>

<div class="weapon">
EQUIPPED: NONE
</div>

<!-- кнопки движения -->

<div class="controls">

<div
class="btn up"
data-key="forward">
▲
</div>

<div
class="btn left"
data-key="left">
◀
</div>

<div
class="btn down"
data-key="back">
▼
</div>

<div
class="btn right"
data-key="right">
▶
</div>

</div>

<!-- кнопки действий -->

<div class="actions">

<div
class="action"
id="interact">

ВЗАИМОД.<br>✋

</div>

<div
class="action"
id="flash">

ФОНАРЬ<br>🔦

</div>

<div
class="action"
id="shoot">

ОГОНЬ<br>🔫

</div>

</div>

</div>

<!-- ================= START ================= -->

<div id="start">

<div class="start-box">

<h1>
THE REDPRO ARCHIVES
</h1>

<p>

GAME PROTOTYPE<br><br>

ОБЪЕКТ: UNKNOWN<br>
СЕКТОР: 01<br>
СТАТУС: ACTIVE

</p>

<button
class="start-button"
id="startButton">

НАЧАТЬ

</button>

</div>

</div>

</div>

<script>

/* ==========================================
   СОСТОЯНИЕ ИГРЫ
========================================== */

const start =
document.getElementById("start");

const startButton =
document.getElementById("startButton");

const world =
document.getElementById("world");

const door =
document.getElementById("door");

const flashlight =
document.getElementById("flashlight");

const message =
document.getElementById("message");

const lookArea =
document.getElementById("lookArea");

const lookHint =
document.getElementById("lookHint");

let started=false;

let lightOn=true;

/* положение игрока */

let playerX=0;

let playerZ=0;

/* направление взгляда */

let yaw=0;

let pitch=0;

/* скорость */

const speed=4;

/* кнопки */

const keys={

forward:false,
back:false,
left:false,
right:false

};


/* ==========================================
   СООБЩЕНИЯ
========================================== */

function showMessage(text){

message.textContent=text;

message.classList.add("show");

clearTimeout(showMessage.timer);

showMessage.timer=setTimeout(()=>{

message.classList.remove("show");

},3000);

}


/* ==========================================
   START
========================================== */

startButton.addEventListener(
"click",
()=>{

started=true;

start.style.display="none";

showMessage(
"Объект неизвестен. Осмотритесь."
);

setTimeout(()=>{

lookHint.classList.add("hide");

},4000);

}
);


/* ==========================================
   ФОНАРИК
========================================== */

document
.getElementById("flash")
.addEventListener(
"pointerdown",
event=>{

event.stopPropagation();

if(!started)return;

lightOn=!lightOn;

flashlight.classList.toggle(
"light-off",
!lightOn
);

showMessage(

lightOn
?
"Фонарик включён."
:
"Фонарик выключен."

);

}
);


/* ==========================================
   ВЗАИМОДЕЙСТВИЕ
========================================== */

document
.getElementById("interact")
.addEventListener(
"pointerdown",
event=>{

event.stopPropagation();

if(!started)return;

const distance=
Math.sqrt(
playerX*playerX+
playerZ*playerZ
);

if(distance<300){

showMessage(
"Дверь заперта. Нужен доступ."
);

}else{

showMessage(
"Слишком далеко."
);

}

}
);


/* ==========================================
   ОРУЖИЕ
========================================== */

document
.getElementById("shoot")
.addEventListener(
"pointerdown",
event=>{

event.stopPropagation();

if(!started)return;

showMessage(
"Оружия пока нет."
);

}
);


/* ==========================================
   КНОПКИ
========================================== */

document
.querySelectorAll(".btn")
.forEach(button=>{

const key=
button.dataset.key;

function down(e){

e.preventDefault();

e.stopPropagation();

keys[key]=true;

}

function up(e){

e.preventDefault();

e.stopPropagation();

keys[key]=false;

}

button.addEventListener(
"pointerdown",
down
);

button.addEventListener(
"pointerup",
up
);

button.addEventListener(
"pointercancel",
up
);

button.addEventListener(
"pointerleave",
up
);

}
);


/* ==========================================
   КЛАВИАТУРА
========================================== */

document.addEventListener(
"keydown",
e=>{

if(e.key==="w")
keys.forward=true;

if(e.key==="s")
keys.back=true;

if(e.key==="a")
keys.left=true;

if(e.key==="d")
keys.right=true;

}
);

document.addEventListener(
"keyup",
e=>{

if(e.key==="w")
keys.forward=false;

if(e.key==="s")
keys.back=false;

if(e.key==="a")
keys.left=false;

if(e.key==="d")
keys.right=false;

}
);


/* ==========================================
   ОСМОТР ПАЛЬЦЕМ
========================================== */

let touching=false;

let lastX=0;

let lastY=0;

lookArea.addEventListener(
"pointerdown",
e=>{

if(!started)return;

touching=true;

lastX=e.clientX;

lastY=e.clientY;

lookHint.classList.add("hide");

}
);

lookArea.addEventListener(
"pointermove",
e=>{

if(!started || !touching)return;

const dx=
e.clientX-lastX;

const dy=
e.clientY-lastY;

lastX=e.clientX;

lastY=e.clientY;

/* горизонт */

yaw+=dx*.12;

/* вертикаль */

pitch-=dy*.08;

/* ограничение */

pitch=
Math.max(
-35,
Math.min(
35,
pitch
)
);

}
);

function stopLook(){

touching=false;

}

lookArea.addEventListener(
"pointerup",
stopLook
);

lookArea.addEventListener(
"pointercancel",
stopLook
);

lookArea.addEventListener(
"pointerleave",
stopLook
);


/* ==========================================
   ДВИЖЕНИЕ
========================================== */

function updateMovement(){

if(!started)return;

if(keys.forward)
playerZ+=speed;

if(keys.back)
playerZ-=speed;

if(keys.left)
playerX-=speed;

if(keys.right)
playerX+=speed;

/* границы коридора */

playerX=
Math.max(
-360,
Math.min(
360,
playerX
)
);

/* границы глубины */

playerZ=
Math.max(
-800,
Math.min(
600,
playerZ
)
);

}


/* ==========================================
   ОТРИСОВКА
========================================== */

function render(){

/*
   Чем дальше игрок идёт,
   тем ближе становится окружение.
*/

const z=
-playerZ;

world.style.transform=

`
translate(-50%,-50%)
rotateX(${pitch}deg)
rotateY(${yaw}deg)
translate3d(
${-playerX}px,
0px,
${z}px
)
`;

}


/* ==========================================
   GAME LOOP
========================================== */

function loop(){

updateMovement();

render();

requestAnimationFrame(loop);

}

loop();


/* ==========================================
   ПРЕДОТВРАЩАЕМ ПРОКРУТКУ
========================================== */

document.addEventListener(
"touchmove",
e=>{

e.preventDefault();

},
{passive:false}
);

</script>

</body>
      </html>

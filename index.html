<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>The Redpro Archives</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

button{
  font:inherit;
  color:inherit;
}

/* =========================
   GAME
========================= */

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050609;
}

#scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  perspective:900px;
  background:#050609;
}

/* =========================
   WORLD
========================= */

#world{
  position:absolute;
  left:50%;
  top:50%;
  width:900px;
  height:2100px;
  transform-style:preserve-3d;
  transform-origin:50% 50%;
  transition:none;
}

.floor{
  position:absolute;
  left:-450px;
  top:0;
  width:900px;
  height:2100px;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 2px,
      transparent 2px,
      transparent 80px
    ),
    linear-gradient(
      180deg,
      #101218,
      #08090c 60%,
      #050609
    );

  transform:
    rotateX(90deg)
    translateZ(-300px);

  transform-origin:50% 0;
}

.ceiling{
  position:absolute;
  left:-450px;
  top:0;
  width:900px;
  height:2100px;

  background:
    linear-gradient(
      180deg,
      #11131a,
      #08090c
    );

  transform:
    rotateX(90deg)
    translateZ(300px);

  transform-origin:50% 0;
}

.wall{
  position:absolute;
  top:0;
  width:600px;
  height:600px;

  background:
    linear-gradient(
      90deg,
      #11131a,
      #090a0e
    );

  border:1px solid #171a22;
}

.wall.left{
  left:-600px;
  transform:
    rotateY(90deg)
    translateZ(450px);
  transform-origin:right center;
}

.wall.right{
  right:-600px;
  transform:
    rotateY(-90deg)
    translateZ(450px);
  transform-origin:left center;
}

.light{
  position:absolute;
  width:250px;
  height:32px;
  left:325px;
  top:100px;

  background:#30333a;

  box-shadow:
    0 0 25px rgba(180,190,210,.18),
    0 0 90px rgba(130,140,170,.10);

  transform:translateZ(-700px);
}

/* =========================
   DOOR
========================= */

#door{
  position:absolute;

  left:250px;
  top:80px;

  width:400px;
  height:500px;

  background:
    linear-gradient(
      90deg,
      #11131a,
      #1a1d25 50%,
      #0b0d12
    );

  border:2px solid #292d37;

  box-shadow:
    0 0 40px rgba(0,0,0,.7),
    inset 0 0 30px rgba(0,0,0,.8);

  transform:
    translateZ(-1000px);

  transform-origin:left center;

  transition:
    transform 900ms ease,
    opacity 900ms ease;
}

#door::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:10px;
  height:10px;

  border-radius:50%;

  background:#bfc3ca;

  box-shadow:
    0 0 8px rgba(255,255,255,.5);
}

#door.open{
  transform:
    translateZ(-1000px)
    rotateY(-85deg);

  opacity:.3;
}

/* =========================
   SECOND AREA
========================= */

#secondArea{
  position:absolute;
  inset:0;

  opacity:0;
  pointer-events:none;

  transition:opacity 600ms ease;

  z-index:2;
}

#secondArea.active{
  opacity:1;
  pointer-events:auto;
}

.backLight{
  position:absolute;

  width:180px;
  height:20px;

  left:calc(50% - 90px);
  top:25%;

  background:#353943;

  box-shadow:
    0 0 30px rgba(210,220,255,.2),
    0 0 130px rgba(150,160,190,.12);
}

/* =========================
   ENEMY
========================= */

.enemy{
  position:absolute;

  width:100px;
  height:190px;

  left:calc(50% - 50px);
  top:42%;

  opacity:0;

  transform:
    translateZ(-500px);

  transition:
    opacity 400ms ease,
    transform 250ms ease;
}

#secondArea.active .enemy{
  opacity:1;
}

.enemyHead{
  position:absolute;

  width:55px;
  height:55px;

  left:22px;
  top:0;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #51555e,
      #181a20 65%
    );

  box-shadow:
    0 0 15px rgba(0,0,0,.8);
}

.enemyBody{
  position:absolute;

  width:100px;
  height:125px;

  left:0;
  top:55px;

  background:
    linear-gradient(
      90deg,
      #17191f,
      #292d35 50%,
      #101218
    );

  border-radius:20px 20px 8px 8px;

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.7);
}

.enemy.hit{
  transform:
    translateZ(-500px)
    translateX(25px);

  filter:brightness(2);
}

.enemy.dead{
  opacity:0 !important;
  transform:
    translateZ(-500px)
    rotate(80deg)
    translateY(100px);
}

/* =========================
   WEAPON
========================= */

.weaponObject{
  position:absolute;

  width:80px;
  height:30px;

  left:calc(50% - 40px);
  top:60%;

  opacity:0;
  pointer-events:none;

  transform:
    translateZ(-300px)
    rotate(-10deg);

  transition:
    opacity 400ms ease;
}

.weaponObject.visible{
  opacity:1;
  pointer-events:auto;
}

.weaponBody{
  position:absolute;

  width:55px;
  height:18px;

  left:0;
  top:0;

  border-radius:4px;

  background:#252932;

  box-shadow:
    0 0 8px rgba(255,255,255,.1);
}

.weaponGrip{
  position:absolute;

  width:18px;
  height:25px;

  left:42px;
  top:12px;

  background:#17191f;

  transform:rotate(15deg);

  border-radius:2px;
}

/* =========================
   LOOK AREA
========================= */

#lookArea{
  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:auto;

  touch-action:none;
}

#lookHint{
  position:absolute;

  left:50%;
  top:72%;

  transform:translateX(-50%);

  color:#858a95;

  font-size:12px;
  letter-spacing:2px;

  opacity:.65;

  z-index:7;

  pointer-events:none;
}

/* =========================
   FLASHLIGHT
========================= */

#flashlight{
  position:absolute;
  inset:0;

  z-index:6;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 50%,
      rgba(255,255,255,.12) 0%,
      rgba(180,190,220,.07) 20%,
      rgba(0,0,0,.25) 48%,
      rgba(0,0,0,.85) 80%
    );

  mix-blend-mode:screen;

  opacity:.8;
}

#flashlight.off{
  opacity:0;
}

/* =========================
   DAMAGE
========================= */

#damage{
  position:absolute;
  inset:0;

  z-index:18;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      transparent 35%,
      rgba(255,0,0,.42)
    );

  opacity:0;

  transition:opacity 120ms ease;
}

#damage.show{
  opacity:1;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  inset:0;

  z-index:20;

  pointer-events:none;
}

.top{
  position:absolute;

  left:28px;
  right:28px;
  top:28px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:17px;
  letter-spacing:1px;

  color:#d8d9de;
}

#hp{
  font-size:16px;
}

.crosshair{
  position:absolute;

  left:50%;
  top:50%;

  width:28px;
  height:28px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

.crosshair::before,
.crosshair::after{
  content:"";

  position:absolute;

  background:#fff;

  opacity:.85;
}

.crosshair::before{
  width:28px;
  height:2px;

  left:0;
  top:13px;
}

.crosshair::after{
  width:2px;
  height:28px;

  left:13px;
  top:0;
}

#enemyHP{
  position:absolute;

  top:80px;
  left:50%;

  transform:translateX(-50%);

  width:180px;
  height:8px;

  border:1px solid #383c46;

  background:#090a0d;

  display:none;
}

#enemyHPFill{
  width:100%;
  height:100%;

  background:#bfc3ca;

  transition:width 150ms ease;
}

#message{
  position:absolute;

  left:50%;
  bottom:24%;

  transform:translateX(-50%);

  min-width:220px;

  text-align:center;

  font-size:14px;
  letter-spacing:1px;

  color:#d8d9de;

  text-shadow:
    0 2px 5px #000;

  opacity:0;

  transition:opacity 200ms ease;

  pointer-events:none;
}

#message.show{
  opacity:1;
}

#weaponText{
  position:absolute;

  right:28px;
  top:145px;

  text-align:right;

  font-size:16px;
  line-height:1.8;

  letter-spacing:1px;

  color:#c9cbd1;
}

/* =========================
   MOVEMENT CONTROLS
========================= */

.controls{
  position:absolute;

  left:30px;
  bottom:28px;

  width:290px;
  height:190px;

  z-index:40;

  pointer-events:auto;
}

.moveBtn{
  position:absolute;

  width:88px;
  height:88px;

  border-radius:22px;

  border:1px solid #383c45;

  background:
    rgba(15,17,22,.72);

  color:#e8e9ec;

  font-size:30px;

  display:flex;
  justify-content:center;
  align-items:center;

  touch-action:none;

  pointer-events:auto;

  box-shadow:
    0 5px 20px rgba(0,0,0,.25);

  transition:
    background 80ms ease,
    transform 80ms ease;
}

.moveBtn:active,
.moveBtn.active{
  background:rgba(100,105,115,.35);
  transform:scale(.94);
}

#up{
  left:100px;
  top:0;
}

#left{
  left:0;
  top:100px;
}

#down{
  left:100px;
  top:100px;
}

#right{
  left:200px;
  top:100px;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions{
  position:absolute;

  right:28px;
  bottom:28px;

  display:flex;
  gap:14px;

  z-index:40;

  pointer-events:auto;
}

.actionBtn{
  width:105px;
  height:105px;

  border-radius:50%;

  border:1px solid #3a3e48;

  background:
    rgba(15,17,22,.78);

  color:#e5e6ea;

  font-size:14px;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:5px;

  text-align:center;

  touch-action:none;

  pointer-events:auto;

  box-shadow:
    0 5px 25px rgba(0,0,0,.3);

  transition:
    transform 80ms ease,
    background 80ms ease;
}

.actionBtn span{
  font-size:24px;
}

.actionBtn:active,
.actionBtn.active{
  transform:scale(.93);
  background:rgba(100,105,115,.35);
}

#punch{
  display:none;
}

#shoot{
  display:none;
}

/* =========================
   START
========================= */

#start{
  position:absolute;
  inset:0;

  z-index:100;

  background:
    radial-gradient(
      circle at center,
      #171a22 0%,
      #08090c 55%,
      #000 100%
    );

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;
}

#start h1{
  margin:0;

  font-size:34px;
  letter-spacing:5px;

  font-weight:400;
}

#start p{
  margin:15px 0 35px;

  color:#777c87;

  letter-spacing:2px;
}

#start button{
  width:220px;
  height:58px;

  border-radius:10px;

  border:1px solid #444852;

  background:#11131a;

  color:#fff;

  letter-spacing:2px;

  touch-action:none;
}

#start button:active{
  transform:scale(.96);
}

/* =========================
   PUZZLE
========================= */

#puzzle{
  position:absolute;
  inset:0;

  z-index:90;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.82);
}

#puzzleBox{
  width:min(340px,85vw);

  padding:25px;

  border:1px solid #383c46;

  background:#0d0f14;

  border-radius:15px;

  text-align:center;
}

#puzzleTitle{
  font-size:18px;
  letter-spacing:2px;
  margin-bottom:8px;
}

#puzzleText{
  color:#858a94;
  font-size:12px;
  line-height:1.5;
  margin-bottom:20px;
}

#dots{
  position:relative;

  width:210px;
  height:210px;

  margin:0 auto 20px;
}

.dot{
  position:absolute;

  width:38px;
  height:38px;

  margin:-19px 0 0 -19px;

  border-radius:50%;

  border:2px solid #777c86;

  background:#11131a;

  color:#fff;

  font-size:13px;

  z-index:3;

  touch-action:none;
}

.dot.selected{
  background:#d8d9de;
  color:#050609;
}

#puzzleCanvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:2;
}

#puzzleClose{
  width:100%;
  height:45px;

  border-radius:8px;

  border:1px solid #3b3f48;

  background:#151820;

  color:#fff;
}

/* =========================
   SHOOT FLASH
========================= */

#muzzleFlash{
  position:absolute;
  left:50%;
  top:50%;

  width:160px;
  height:160px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.95),
      rgba(255,210,100,.55) 15%,
      rgba(255,120,0,.18) 35%,
      transparent 70%
    );

  opacity:0;

  z-index:17;

  pointer-events:none;
}

#muzzleFlash.show{
  animation:muzzle .12s ease;
}

@keyframes muzzle{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}
}

/* =========================
   PORTRAIT WARNING
========================= */

#rotateHint{
  display:none;

  position:absolute;
  inset:0;

  z-index:200;

  background:#050609;

  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:18px;
  letter-spacing:2px;
}

/* =========================
   FULLSCREEN
========================= */

:fullscreen #game{
  width:100vw;
  height:100vh;
}

:-webkit-full-screen #game{
  width:100vw;
  height:100vh;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .top{
    left:25px;
    right:25px;
    top:25px;
  }

  #weaponText{
    right:25px;
    top:120px;
    font-size:14px;
  }

  .controls{
    left:25px;
    bottom:25px;

    transform:scale(.82);
    transform-origin:left bottom;
  }

  .actions{
    right:20px;
    bottom:25px;

    gap:7px;

    transform:scale(.72);
    transform-origin:right bottom;
  }
}

@media(orientation:portrait){

  #rotateHint{
    display:flex;
  }

}

</style>
</head>

<body>

<div id="game">

  <div id="scene">

    <div id="world">

      <div class="floor"></div>
      <div class="ceiling"></div>

      <div class="wall left"></div>
      <div class="wall right"></div>

      <div class="light"></div>

      <div id="door"></div>

    </div>

    <div id="secondArea">

      <div class="backLight"></div>

      <div id="enemy" class="enemy">
        <div class="enemyHead"></div>
        <div class="enemyBody"></div>
      </div>

      <div id="weaponObject" class="weaponObject">
        <div class="weaponBody"></div>
        <div class="weaponGrip"></div>
      </div>

    </div>

  </div>

  <div id="lookArea"></div>

  <div id="flashlight"></div>

  <div id="damage"></div>

  <div id="muzzleFlash"></div>

  <div id="hud">

    <div class="top">
      <div>REDPRO ARCHIVES</div>
      <div id="hp">HP 100</div>
    </div>

    <div class="crosshair"></div>

    <div id="enemyHP">
      <div id="enemyHPFill"></div>
    </div>

    <div id="weaponText">
      UNARMED
    </div>

    <div id="message"></div>

    <div class="controls">

      <button class="moveBtn"
              id="up"
              data-key="forward">
        ▲
      </button>

      <button class="moveBtn"
              id="left"
              data-key="left">
        ◀
      </button>

      <button class="moveBtn"
              id="down"
              data-key="back">
        ▼
      </button>

      <button class="moveBtn"
              id="right"
              data-key="right">
        ▶
      </button>

    </div>

    <div class="actions">

      <button
        class="actionBtn"
        id="interact">
        ВЗАИМОД.
        <span>🖐️</span>
      </button>

      <button
        class="actionBtn"
        id="flash">
        ФОНАРЬ
        <span>🔦</span>
      </button>

      <button
        class="actionBtn"
        id="punch">
        УДАР
        <span>👊</span>
      </button>

      <button
        class="actionBtn"
        id="shoot">
        ОГОНЬ
        <span>🔫</span>
      </button>

      <button
        class="actionBtn"
        id="reload">
        ПЕРЕЗАР.
        <span>↪️</span>
      </button>

    </div>

  </div>

  <div id="lookHint">
    ПРОВЕДИТЕ ПАЛЬЦЕМ ДЛЯ ОБЗОРА
  </div>

  <!-- START -->

  <div id="start">

    <h1>THE REDPRO ARCHIVES</h1>

    <p>ARCHIVE 01</p>

    <button id="startButton">
      НАЧАТЬ
    </button>

  </div>

  <!-- PUZZLE -->

  <div id="puzzle">

    <div id="puzzleBox">

      <div id="puzzleTitle">
        СИСТЕМА ДОСТУПА
      </div>

      <div id="puzzleText">
        Соедините 7 точек в правильной последовательности.
      </div>

      <div id="dots">

        <canvas id="puzzleCanvas"></canvas>

        <button class="dot" data-n="1"
          style="left:25%;top:25%;">1</button>

        <button class="dot" data-n="2"
          style="left:50%;top:25%;">2</button>

        <button class="dot" data-n="3"
          style="left:75%;top:25%;">3</button>

        <button class="dot" data-n="4"
          style="left:25%;top:50%;">4</button>

        <button class="dot" data-n="5"
          style="left:50%;top:50%;">5</button>

        <button class="dot" data-n="6"
          style="left:75%;top:50%;">6</button>

        <button class="dot" data-n="7"
          style="left:25%;top:75%;">7</button>

      </div>

      <button id="puzzleClose">
        ОТМЕНА
      </button>

    </div>

  </div>

  <div id="rotateHint">
    ПОВЕРНИТЕ ТЕЛЕФОН<br>
    В ГОРИЗОНТАЛЬНЫЙ РЕЖИМ
  </div>

</div>


<script>

/* =========================================================
   PWA
========================================================= */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
      .register("./sw.js")
      .then(()=>{
        console.log("Redpro Archives: offline mode enabled");
      })
      .catch(err=>{
        console.log("Service Worker error:",err);
      });

  });

}


/* =========================================================
   ELEMENTS
========================================================= */

const game =
  document.getElementById("game");

const scene =
  document.getElementById("scene");

const world =
  document.getElementById("world");

const door =
  document.getElementById("door");

const secondArea =
  document.getElementById("secondArea");

const enemy =
  document.getElementById("enemy");

const weaponObject =
  document.getElementById("weaponObject");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const puzzle =
  document.getElementById("puzzle");

const puzzleClose =
  document.getElementById("puzzleClose");

const interact =
  document.getElementById("interact");

const flash =
  document.getElementById("flash");

const punch =
  document.getElementById("punch");

const shoot =
  document.getElementById("shoot");

const reload =
  document.getElementById("reload");

const flashlight =
  document.getElementById("flashlight");

const damage =
  document.getElementById("damage");

const muzzleFlash =
  document.getElementById("muzzleFlash");

const hpText =
  document.getElementById("hp");

const weaponText =
  document.getElementById("weaponText");

const message =
  document.getElementById("message");

const enemyHP =
  document.getElementById("enemyHP");

const enemyHPFill =
  document.getElementById("enemyHPFill");

const lookArea =
  document.getElementById("lookArea");

const puzzleCanvas =
  document.getElementById("puzzleCanvas");

const puzzleCtx =
  puzzleCanvas.getContext("2d");


/* =========================================================
   GAME STATE
========================================================= */

let started = false;

let doorUnlocked = false;
let doorOpened = false;

let enemyDefeated = false;

let hasGun = false;
let lightOn = true;

let playerHP = 100;
let enemyHealth = 100;

let ammo = 12;
let maxAmmo = 12;

let reloading = false;

let playerX = 0;
let playerZ = 500;

let yaw = 0;
let pitch = 0;

let speed = 5;

let enemyAttackTimer = 0;
let enemyDistance = 700;

let lastTime = performance.now();


/* =========================================================
   MOVEMENT
========================================================= */

const keys = {
  forward:false,
  back:false,
  left:false,
  right:false
};


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text, time=1800){

  message.textContent = text;

  message.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer = setTimeout(()=>{
    message.classList.remove("show");
  },time);
}


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen(){

  try{

    if(document.fullscreenElement){
      return;
    }

    if(game.requestFullscreen){

      await game.requestFullscreen();

    }else if(game.webkitRequestFullscreen){

      game.webkitRequestFullscreen();

    }

  }catch(e){

    console.log("Fullscreen:",e);

  }

}


/* =========================================================
   START GAME
========================================================= */

startButton.addEventListener("click",async()=>{

  started = true;

  start.style.display = "none";

  await enterFullscreen();

  showMessage(
    "Найдите способ открыть дверь",
    2500
  );

  render();

});


/* =========================================================
   MOVEMENT BUTTONS
   IMPORTANT FIX:
   POINTER CAPTURE
========================================================= */

const movementButtons =
  document.querySelectorAll(".moveBtn");


function clearMovement(){

  keys.forward = false;
  keys.back = false;
  keys.left = false;
  keys.right = false;

  movementButtons.forEach(btn=>{
    btn.classList.remove("active");
  });

}


movementButtons.forEach(button=>{

  const key =
    button.dataset.key;

  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      if(!started) return;

      keys[key] = true;

      button.classList.add("active");

      try{
        button.setPointerCapture(e.pointerId);
      }catch(err){}

    },
    {passive:false}
  );


  button.addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      keys[key] = false;

      button.classList.remove("active");

      try{
        button.releasePointerCapture(e.pointerId);
      }catch(err){}

    },
    {passive:false}
  );


  button.addEventListener(
    "pointercancel",
    e=>{

      keys[key] = false;

      button.classList.remove("active");

    },
    {passive:false}
  );


  button.addEventListener(
    "lostpointercapture",
    ()=>{

      keys[key] = false;

      button.classList.remove("active");

    }
  );

});


window.addEventListener("pointerup",clearMovement);
window.addEventListener("pointercancel",clearMovement);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",e=>{

  if(e.key==="w" || e.key==="ArrowUp"){
    keys.forward = true;
  }

  if(e.key==="s" || e.key==="ArrowDown"){
    keys.back = true;
  }

  if(e.key==="a" || e.key==="ArrowLeft"){
    keys.left = true;
  }

  if(e.key==="d" || e.key==="ArrowRight"){
    keys.right = true;
  }

});


window.addEventListener("keyup",e=>{

  if(e.key==="w" || e.key==="ArrowUp"){
    keys.forward = false;
  }

  if(e.key==="s" || e.key==="ArrowDown"){
    keys.back = false;
  }

  if(e.key==="a" || e.key==="ArrowLeft"){
    keys.left = false;
  }

  if(e.key==="d" || e.key==="ArrowRight"){
    keys.right = false;
  }

});


/* =========================================================
   LOOK
========================================================= */

let looking = false;

let lookPointer = null;

let lastLookX = 0;
let lastLookY = 0;


lookArea.addEventListener(
  "pointerdown",
  e=>{

    if(!started) return;

    looking = true;

    lookPointer = e.pointerId;

    lastLookX = e.clientX;
    lastLookY = e.clientY;

    try{
      lookArea.setPointerCapture(e.pointerId);
    }catch(err){}

  },
  {passive:true}
);


lookArea.addEventListener(
  "pointermove",
  e=>{

    if(!looking) return;

    if(e.pointerId !== lookPointer) return;

    const dx =
      e.clientX - lastLookX;

    const dy =
      e.clientY - lastLookY;

    lastLookX = e.clientX;
    lastLookY = e.clientY;

    yaw += dx * .35;

    pitch -= dy * .2;

    pitch =
      Math.max(
        -35,
        Math.min(35,pitch)
      );

  },
  {passive:true}
);


function stopLook(){

  looking = false;
  lookPointer = null;

}


lookArea.addEventListener(
  "pointerup",
  stopLook
);

lookArea.addEventListener(
  "pointercancel",
  stopLook
);


/* =========================================================
   MOVEMENT UPDATE
========================================================= */

function updateMovement(dt){

  if(!started) return;

  const amount =
    speed * dt;

  if(keys.forward){

    playerZ -= amount;

  }

  if(keys.back){

    playerZ += amount;

  }

  if(keys.left){

    playerX -= amount;

  }

  if(keys.right){

    playerX += amount;

  }

  playerX =
    Math.max(
      -360,
      Math.min(360,playerX)
    );

  playerZ =
    Math.max(
      -1900,
      Math.min(700,playerZ)
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const cameraX =
    playerX;

  const cameraZ =
    playerZ;

  world.style.transform = `
    translate3d(
      ${-cameraX}px,
      ${pitch}px,
      ${cameraZ}px
    )
    rotateY(${yaw}deg)
  `;

}


/* =========================================================
   DOOR
========================================================= */

interact.addEventListener("click",()=>{

  if(!started) return;


  if(!doorOpened){

    if(!doorUnlocked){

      openPuzzle();

      return;

    }

    openDoor();

    return;

  }


  if(
    !enemyDefeated &&
    secondArea.classList.contains("active")
  ){

    showMessage(
      "Сначала разберитесь с противником",
      1600
    );

    return;

  }


  if(
    enemyDefeated &&
    !hasGun
  ){

    pickupWeapon();

    return;

  }


  showMessage(
    "Коридор продолжается...",
    1500
  );

});


/* =========================================================
   PUZZLE
========================================================= */

const correctSequence =
  [1,4,7,6,3,2,5];

let selectedDots = [];


function resizePuzzleCanvas(){

  const rect =
    document
      .getElementById("dots")
      .getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  puzzleCanvas.width =
    rect.width * dpr;

  puzzleCanvas.height =
    rect.height * dpr;

  puzzleCtx.setTransform(
    dpr,0,0,dpr,0,0
  );

}


function openPuzzle(){

  puzzle.style.display = "flex";

  selectedDots = [];

  document
    .querySelectorAll(".dot")
    .forEach(dot=>{
      dot.classList.remove("selected");
    });

  setTimeout(
    resizePuzzleCanvas,
    30
  );

}


function closePuzzle(){

  puzzle.style.display = "none";

  selectedDots = [];

  document
    .querySelectorAll(".dot")
    .forEach(dot=>{
      dot.classList.remove("selected");
    });

  clearPuzzleCanvas();

}


puzzleClose.addEventListener(
  "click",
  closePuzzle
);


function clearPuzzleCanvas(){

  puzzleCtx.clearRect(
    0,
    0,
    puzzleCanvas.width,
    puzzleCanvas.height
  );

}


function drawPuzzleLines(){

  clearPuzzleCanvas();

  if(selectedDots.length < 2){
    return;
  }

  const container =
    document
      .getElementById("dots")
      .getBoundingClientRect();

  puzzleCtx.beginPath();

  selectedDots.forEach(
    (number,index)=>{

      const dot =
        document.querySelector(
          `.dot[data-n="${number}"]`
        );

      const r =
        dot.getBoundingClientRect();

      const x =
        r.left -
        container.left +
        r.width/2;

      const y =
        r.top -
        container.top +
        r.height/2;

      if(index===0){
        puzzleCtx.moveTo(x,y);
      }else{
        puzzleCtx.lineTo(x,y);
      }

    }
  );

  puzzleCtx.strokeStyle =
    "#d8d9de";

  puzzleCtx.lineWidth = 3;

  puzzleCtx.stroke();

}


document
  .querySelectorAll(".dot")
  .forEach(dot=>{

    dot.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();

        const n =
          Number(dot.dataset.n);

        if(selectedDots.includes(n)){
          return;
        }

        selectedDots.push(n);

        dot.classList.add("selected");

        drawPuzzleLines();

        checkPuzzle();

      },
      {passive:false}
    );

  });


function checkPuzzle(){

  const length =
    selectedDots.length;

  for(let i=0;i<length;i++){

    if(
      selectedDots[i] !==
      correctSequence[i]
    ){

      showMessage(
        "ОШИБКА. ПОСЛЕДОВАТЕЛЬНОСТЬ НЕВЕРНА",
        1500
      );

      setTimeout(()=>{
        selectedDots = [];

        document
          .querySelectorAll(".dot")
          .forEach(dot=>{
            dot.classList.remove("selected");
          });

        clearPuzzleCanvas();

      },500);

      return;

    }

  }


  if(
    selectedDots.length ===
    correctSequence.length
  ){

    doorUnlocked = true;

    showMessage(
      "ДОСТУП РАЗРЕШЁН",
      2000
    );

    setTimeout(()=>{

      closePuzzle();

      showMessage(
        "Дверь разблокирована. Нажмите ВЗАИМОД.",
        2200
      );

    },800);

  }

}


/* =========================================================
   OPEN DOOR
========================================================= */

function openDoor(){

  if(doorOpened) return;

  doorOpened = true;

  door.classList.add("open");

  showMessage(
    "ДВЕРЬ ОТКРЫВАЕТСЯ...",
    1000
  );

  setTimeout(()=>{

    secondArea.classList.add("active");

    enemyHP.style.display = "block";

    punch.style.display = "flex";

    updateEnemyHP();

    showMessage(
      "ВПЕРЕДИ ПРОТИВНИК",
      2000
    );

  },900);

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function enemyAttack(dt){

  if(
    !doorOpened ||
    enemyDefeated ||
    !secondArea.classList.contains("active")
  ){
    return;
  }

  enemyAttackTimer += dt;

  if(enemyAttackTimer < 2.0){
    return;
  }

  enemyAttackTimer = 0;

  playerHP -= 8;

  if(playerHP < 0){
    playerHP = 0;
  }

  hpText.textContent =
    "HP " + playerHP;

  damage.classList.add("show");

  setTimeout(()=>{
    damage.classList.remove("show");
  },140);

  if(playerHP <= 0){

    playerHP = 100;

    hpText.textContent = "HP 100";

    showMessage(
      "ВЫ ПОТЕРЯЛИ СОЗНАНИЕ",
      1800
    );

  }

}


/* =========================================================
   PUNCH
========================================================= */

punch.addEventListener("click",()=>{

  if(
    !doorOpened ||
    enemyDefeated
  ){
    return;
  }

  if(
    hasGun
  ){
    showMessage(
      "Используйте пистолет",
      1000
    );

    return;
  }

  enemyHealth -= 25;

  if(enemyHealth < 0){
    enemyHealth = 0;
  }

  enemy.classList.add("hit");

  setTimeout(()=>{
    enemy.classList.remove("hit");
  },180);

  damage.classList.add("show");

  setTimeout(()=>{
    damage.classList.remove("show");
  },80);

  updateEnemyHP();

  if(enemyHealth <= 0){

    defeatEnemy();

  }

});


function updateEnemyHP(){

  enemyHPFill.style.width =
    enemyHealth + "%";

}


function defeatEnemy(){

  enemyDefeated = true;

  enemy.classList.add("dead");

  enemyHP.style.display = "none";

  punch.style.display = "none";

  setTimeout(()=>{

    weaponObject.classList.add("visible");

    showMessage(
      "ПРОТИВНИК УСТРАНЁН. ЗАБЕРИТЕ ОРУЖИЕ.",
      2500
    );

  },500);

}


/* =========================================================
   WEAPON PICKUP
========================================================= */

function pickupWeapon(){

  if(hasGun) return;

  hasGun = true;

  weaponObject.classList.remove("visible");

  shoot.style.display = "flex";

  weaponText.innerHTML =
    "EQUIPPED: PISTOL<br>AMMO: " +
    ammo +
    "/" +
    maxAmmo;

  showMessage(
    "ПИСТОЛЕТ ПОДОБРАН",
    1600
  );

}


weaponObject.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(enemyDefeated){
      pickupWeapon();
    }

  },
  {passive:false}
);


/* =========================================================
   FLASHLIGHT
========================================================= */

flash.addEventListener("click",()=>{

  lightOn = !lightOn;

  if(lightOn){

    flashlight.classList.remove("off");

    showMessage(
      "ФОНАРЬ ВКЛЮЧЁН",
      900
    );

  }else{

    flashlight.classList.add("off");

    showMessage(
      "ФОНАРЬ ВЫКЛЮЧЕН",
      900
    );

  }

});


/* =========================================================
   SHOOT
========================================================= */

shoot.addEventListener("click",()=>{

  if(!hasGun){
    return;
  }

  if(reloading){
    return;
  }

  if(ammo <= 0){

    showMessage(
      "НЕТ ПАТРОНОВ. ПЕРЕЗАРЯДИТЕСЬ.",
      1200
    );

    return;

  }

  ammo--;

  weaponText.innerHTML =
    "EQUIPPED: PISTOL<br>AMMO: " +
    ammo +
    "/" +
    maxAmmo;

  muzzleFlash.classList.remove("show");

  void muzzleFlash.offsetWidth;

  muzzleFlash.classList.add("show");


  /* В этом прототипе выстрел попадает,
     если противник ещё жив. */

  if(
    doorOpened &&
    !enemyDefeated &&
    secondArea.classList.contains("active")
  ){

    enemyHealth -= 50;

    if(enemyHealth < 0){
      enemyHealth = 0;
    }

    enemy.classList.add("hit");

    setTimeout(()=>{
      enemy.classList.remove("hit");
    },150);

    updateEnemyHP();

    if(enemyHealth <= 0){

      defeatEnemy();

    }

  }

});


/* =========================================================
   RELOAD
========================================================= */

reload.addEventListener("click",()=>{

  if(!hasGun){
    return;
  }

  if(reloading){
    return;
  }

  if(ammo >= maxAmmo){

    showMessage(
      "МАГАЗИН ПОЛОН",
      900
    );

    return;

  }

  reloading = true;

  showMessage(
    "ПЕРЕЗАРЯДКА...",
    1000
  );

  setTimeout(()=>{

    ammo = maxAmmo;

    reloading = false;

    weaponText.innerHTML =
      "EQUIPPED: PISTOL<br>AMMO: " +
      ammo +
      "/" +
      maxAmmo;

    showMessage(
      "ГОТОВО",
      700
    );

  },1000);

});


/* =========================================================
   PREVENT PAGE SCROLL
========================================================= */

document.addEventListener(
  "touchmove",
  e=>{

    if(
      puzzle.style.display !== "flex"
    ){
      e.preventDefault();
    }

  },
  {passive:false}
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    if(
      puzzle.style.display === "flex"
    ){
      resizePuzzleCanvas();
      drawPuzzleLines();
    }

  }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(time){

  const dt =
    Math.min(
      (time-lastTime)/1000,
      .05
    );

  lastTime = time;

  updateMovement(dt);

  enemyAttack(dt);

  render();

  requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* =========================================================
   INITIAL
========================================================= */

flashlight.classList.remove("off");

render();

</script>

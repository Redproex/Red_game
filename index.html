<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Menu</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial Black, Arial, sans-serif;
}

body{
    margin:0;
    background:#18233a;
    overflow:hidden;
}


/* ВЕРХ */

.top{
    height:90px;
    background:#102b50;
    border-bottom:5px solid #07111f;
    display:flex;
    align-items:center;
    padding:10px;
}


.logo{
    width:65px;
    height:65px;
    background:#600000;
    border:4px solid #ff0000;
}


.name{
    margin-left:15px;
    color:white;
    font-size:28px;
    text-shadow:3px 3px #000;
}


.status{
    width:40px;
    height:40px;
    background:#20e000;
    border-radius:50%;
    margin-left:20px;
    border:3px solid black;
}


.slot{
    margin-left:20px;
    width:130px;
    height:55px;
    background:#142d50;
    border:4px solid #07111f;
}


.settings{
    margin-left:auto;
    width:60px;
    height:60px;
    background:#238de0;
    border:4px solid #07111f;
    color:white;
    font-size:35px;
}



/* ОСНОВА */

.game{
    display:flex;
    height:calc(100vh - 90px);
}



/* ЛЕВО */

.menu{
    width:150px;
    padding:45px 10px;
}


.mode{
    height:85px;
    margin-bottom:8px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:22px;

    border:4px solid #07111f;

    background:#26508a;

    text-align:center;

    text-shadow:
    3px 3px black;
}


.mode.active{
    background:#9b18c9;
}



/* ЦЕНТР */

.center{
    flex:1;
    padding:45px 0;
}


.arena{

    height:450px;

    background:#b90000;

    border:5px solid #111;

}



/* ПРАВО */

.right{

    width:380px;

    background:#303745;

    border:5px solid #111;

    margin:45px 20px;

    padding:25px;

}


.progress{

    height:35px;

    background:#1b7bd0;

    border:4px solid black;

    margin-bottom:90px;

}



.play{

    width:100%;

    height:100px;

    background:#ffb800;

    border:5px solid #111;

    font-size:55px;

}


.team{

    margin-top:10px;

    width:100%;

    height:70px;

    background:#168ee0;

    border:5px solid #111;

    color:white;

    font-size:35px;

}



/* НИЗ */

.bottom{

position:absolute;

bottom:30px;

left:170px;

right:420px;

display:flex;

gap:30px;

}


.card{

height:130px;

flex:1;

background:#1c5c9b;

border:5px solid #111;

}


.card.yellow{

background:#ffb800;

}



.text{

color:white;

font-size:25px;

text-align:center;

margin-top:45px;

text-shadow:3px 3px black;

}


</style>

</head>


<body>


<div class="top">

<div class="logo"></div>

<div class="name">
PLAYER
</div>

<div class="status"></div>

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>


<button class="settings">
⚙
</button>

</div>




<div class="game">


<div class="menu">

<div class="mode active">
СОЛО
</div>

<div class="mode">
ФУТБОЛ
</div>

<div class="mode">
БОСС
</div>

<div class="mode">
ЗАХВАТ<br>ЗОНЫ
</div>

</div>




<div class="center">

<div class="arena"></div>

</div>




<div class="right">

<div class="progress"></div>

<button class="play">
PLAY
</button>

<button class="team">
КОМАНДА
</button>


</div>


</div>




<div class="bottom">

<div class="card">
<div class="text">БОЙЦЫ</div>
</div>

<div class="card yellow">
<div class="text">МАГАЗИН</div>
</div>

<div class="card">
<div class="text">БОЙ</div>
</div>

</div>


</body>
</html>

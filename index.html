<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Game UI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#18243b;
    font-family:Impact, Arial Black, sans-serif;
    overflow:hidden;
}


/* верхняя панель */

.top{
    height:75px;
    background:#102d52;
    border-bottom:5px solid #07101d;
    display:flex;
    align-items:center;
    padding:8px;
}


.shop{
    width:120px;
    height:55px;
    background:#2465a8;
    border:4px solid #050b14;
    color:white;
    font-size:25px;
    text-align:center;
    padding-top:10px;
    text-shadow:3px 3px black;
}


.player{
    margin-left:15px;
    width:240px;
    height:55px;
    background:#17385d;
    border:4px solid #050b14;
    color:white;
    font-size:25px;
    padding:10px;
    text-shadow:3px 3px black;
}


.circle{
    width:40px;
    height:40px;
    background:#00d900;
    border:4px solid black;
    border-radius:50%;
    margin-left:15px;
}


.resource{
    margin-left:15px;
    width:90px;
    height:45px;
    background:#111;
    border:3px solid #000;
}


.settings{
    margin-left:auto;
    width:55px;
    height:55px;
    background:#1689d8;
    border:4px solid black;
    color:white;
    font-size:30px;
}



/* основная часть */

.main{
    display:flex;
    height:calc(100vh - 75px);
    padding:20px;
    gap:15px;
}



/* меню слева */

.left{

    width:170px;

}


.mode{

    height:70px;

    margin-bottom:8px;

    background:#315b91;

    border:5px solid #060b13;

    color:white;

    font-size:23px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    text-shadow:3px 3px black;

}


.mode.active{

    background:#a020c9;

}




/* центральная зона */

.center{

    flex:1;

}


.arena{

    height:80%;

    background:#bd0000;

    border:5px solid black;

}



/* правая панель */


.right{

    width:300px;

    background:#303744;

    border:5px solid black;

    padding:20px;

}



.bar{

    height:30px;

    background:#167bd1;

    border:4px solid black;

}



.play{

    margin-top:80px;

    width:100%;

    height:90px;

    background:#ffbd00;

    border:5px solid black;

    font-size:55px;

    font-family:Impact;

}



.team{

    width:100%;

    height:65px;

    margin-top:10px;

    background:#168de0;

    border:5px solid black;

    color:white;

    font-size:30px;

    font-family:Impact;

}



/* нижние панели */


.bottom{

    position:absolute;

    bottom:20px;

    left:205px;

    right:335px;

    display:flex;

    gap:15px;

}


.card{

    height:110px;

    flex:1;

    background:#27629b;

    border:5px solid black;

}

</style>

</head>


<body>


<div class="top">

<div class="shop">
SHOP
</div>

<div class="player">
PLAYER
</div>

<div class="circle"></div>

<div class="resource"></div>
<div class="resource"></div>
<div class="resource"></div>

<button class="settings">
⚙
</button>

</div>



<div class="main">


<div class="left">

<div class="mode active">
СОЛО
</div>

<div class="mode">
ФУТБОЛ
</div>

<div class="mode">
БОСС
</div>

<div class="mode">
ЗАХВАТ<br>ЗОНЫ
</div>

</div>



<div class="center">

<div class="arena"></div>

</div>



<div class="right">

<div class="bar"></div>

<button class="play">
PLAY
</button>

<button class="team">
КОМАНДА
</button>

</div>


</div>



<div class="bottom">

<div class="card"></div>

<div class="card"></div>

<div class="card"></div>

</div>



</body>
</html>

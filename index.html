<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>REDPRO — Взломщики</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-tap-highlight-color:transparent;
}

body{
 margin:0;
 overflow:hidden;
 background:#050505;
 color:white;
 font-family:Arial,sans-serif;
}

#game{
 width:100vw;
 height:100vh;
 background:#08090d;
 position:relative;
 overflow:hidden;
}

canvas{
 position:absolute;
 width:100%;
 height:100%;
 image-rendering:pixelated;
}

#hud{
 position:absolute;
 top:10px;
 left:10px;
 right:10px;
 z-index:5;
 display:flex;
 justify-content:space-between;
}

.box{
 background:#1118;
 border:1px solid #444;
 padding:8px;
 border-radius:8px;
}

#quest{
 color:#ff4444;
}

#dialog{
 position:absolute;
 left:5%;
 right:5%;
 bottom:120px;
 background:#111;
 border:2px solid #444;
 border-radius:12px;
 padding:15px;
 display:none;
 z-index:10;
}

#name{
 color:#ff3333;
 font-weight:bold;
}

#next{
 margin-top:10px;
 padding:10px;
 background:#222;
 color:white;
 border:1px solid #555;
 border-radius:8px;
}


#controls{
 position:absolute;
 bottom:15px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 padding:15px;
 z-index:20;
}


button{
 width:65px;
 height:65px;
 border-radius:15px;
 border:2px solid #555;
 background:#151515cc;
 color:white;
 font-size:25px;
}


#menu{
 position:absolute;
 inset:0;
 background:#08090d;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:30;
}

.menu{
 text-align:center;
}

.logo{
 font-size:60px;
 font-weight:900;
}

.logo span{
 color:red;
}

.start{
 margin-top:30px;
 width:250px;
 height:60px;
 font-size:20px;
}


</style>

</head>


<body>


<div id="game">


<div id="menu">

<div class="menu">

<div class="logo">
RED<span>PRO</span>
</div>

<p>
Глава 1: Взломщики
</p>


<button class="start" onclick="startGame()">
НАЧАТЬ
</button>


</div>

</div>



<div id="hud">

<div class="box" id="quest">
Квест: Осмотреть камеру
</div>

<div class="box">
REDPRO
</div>

</div>



<canvas id="canvas"></canvas>



<div id="dialog">

<div id="name">
REDPRO
</div>

<div id="text">
...
</div>

<button id="next">
Далее
</button>

</div>



<div id="controls">

<div>

<button id="left">
◀
</button>


<button id="right">
▶
</button>

</div>


<div>

<button id="jump">
▲
</button>


<button id="action">
●
</button>

</div>


</div>



</div><script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}

resize();
addEventListener("resize",resize);



let game=false;


let player={
 x:120,
 y:300,
 w:35,
 h:55,
 vx:0,
 vy:0,
 speed:5,
 jump:13,
 ground:false
};


let camera=0;


let keys={
 left:false,
 right:false
};



let objects=[

{
 x:300,
 y:430,
 w:50,
 h:70,
 type:"terminal",
 used:false
},

{
 x:650,
 y:380,
 w:60,
 h:120,
 type:"door",
 open:false
},

{
 x:1100,
 y:430,
 w:80,
 h:80,
 type:"exit"
}

];



let quest=0;



let dialogs=[];

let dialogOpen=false;



function say(name,text){

 dialogs.push({
  name:name,
  text:text
 });


 if(!dialogOpen)
 showDialog();

}



function showDialog(){

 if(dialogs.length==0){

  dialogOpen=false;
  document.getElementById("dialog").style.display="none";
  return;

 }


 let d=dialogs.shift();


 dialogOpen=true;


 document.getElementById("dialog").style.display="block";

 document.getElementById("name").innerHTML=d.name;

 document.getElementById("text").innerHTML=d.text;

}



document.getElementById("next").onclick=function(){

 showDialog();

};






function startGame(){

 document.getElementById("menu").style.display="none";

 game=true;


 say(
 "СИСТЕМА",
 "Пробуждение. Камера Титанов. Объект T-07."
 );


 say(
 "REDPRO",
 "Они меня похитили... Нужно выбраться."
 );


 updateQuest();

 loop();

}






function updateQuest(){

let q=[
"Квест: Осмотреть камеру",
"Квест: Взломать терминал",
"Квест: Открыть дверь",
"Квест: Добраться до выхода"
];


document.getElementById("quest").innerHTML=q[quest];


}






function action(){


if(dialogOpen)return;



for(let o of objects){


let dist=Math.abs(player.x-o.x);


if(dist<80){



if(o.type=="terminal" && quest==0){

o.used=true;

quest=1;

updateQuest();


say(
"REDPRO",
"Терминал Титанов. Попробую взломать."
);


say(
"ТЕРМИНАЛ",
"Доступ получен. Код двери найден."
);


}



else if(o.type=="door" && quest==1){


o.open=true;

quest=2;

updateQuest();



say(
"СИСТЕМА",
"Дверь разблокирована."
);


say(
"REDPRO",
"Первый шаг сделан. Дальше только вперёд."
);


}



else if(o.type=="exit" && quest==2){


quest=3;

updateQuest();


say(
"REDPRO",
"Я выбрался..."
);


say(
"НЕИЗВЕСТНЫЙ",
"Но это только начало."
);


}



}


}


}






document.getElementById("left").ontouchstart=
()=>keys.left=true;

document.getElementById("left").ontouchend=
()=>keys.left=false;


document.getElementById("right").ontouchstart=
()=>keys.right=true;

document.getElementById("right").ontouchend=
()=>keys.right=false;



document.getElementById("jump").ontouchstart=function(){

if(player.ground)
player.vy=-player.jump;

};



document.getElementById("action").ontouchstart=function(){

action();

};





addEventListener("keydown",e=>{


if(e.key=="ArrowLeft")
keys.left=true;


if(e.key=="ArrowRight")
keys.right=true;


if(e.key==" ")
if(player.ground)
player.vy=-player.jump;



if(e.key=="e")
action();


});



addEventListener("keyup",e=>{


if(e.key=="ArrowLeft")
keys.left=false;


if(e.key=="ArrowRight")
keys.right=false;


});






function update(){


if(!game)return;



player.vx=0;


if(keys.left)
player.vx=-player.speed;


if(keys.right)
player.vx=player.speed;



player.x+=player.vx;



player.vy+=0.7;

player.y+=player.vy;



if(player.y+player.h>500){

player.y=500-player.h;

player.vy=0;

player.ground=true;

}else{

player.ground=false;

}





camera=player.x-300;


if(camera<0)
camera=0;



}function draw(){


ctx.clearRect(0,0,W,H);



ctx.save();

ctx.translate(-camera,0);



// фон

ctx.fillStyle="#0b0e14";
ctx.fillRect(camera,0,W,H);



// стены базы Титанов

ctx.fillStyle="#151923";

for(let x=0;x<1600;x+=120){

ctx.fillRect(x,150,80,300);

}



// пол

ctx.fillStyle="#333844";

ctx.fillRect(0,500,1600,80);



// линии пола

ctx.fillStyle="#555b68";

for(let x=0;x<1600;x+=60){

ctx.fillRect(x,500,35,5);

}




// объекты


for(let o of objects){



if(o.type=="terminal"){


ctx.fillStyle=o.used?"#55d98b":"#2488c7";

ctx.fillRect(
o.x,
o.y,
o.w,
o.h
);


ctx.fillStyle="#000";

ctx.fillRect(
o.x+10,
o.y+15,
30,
15
);



}




if(o.type=="door"){


ctx.fillStyle=o.open?"#55d98b":"#8b2525";

ctx.fillRect(
o.x,
o.y,
o.w,
o.h
);


}



if(o.type=="exit"){


ctx.fillStyle="#55d98b";

ctx.fillRect(
o.x,
o.y,
o.w,
o.h
);


ctx.fillStyle="#000";

ctx.fillText(
"EXIT",
o.x+15,
o.y+40
);


}


}




// Титан охранник

if(player.x>750 && quest<3){


ctx.fillStyle="#771d28";

ctx.fillRect(
850,
430,
40,
70
);


ctx.fillStyle="white";

ctx.fillText(
"TITAN",
840,
420
);


}





// REDPRO


ctx.fillStyle="#ff3333";

ctx.fillRect(
player.x,
player.y,
player.w,
player.h
);



ctx.fillStyle="#111";

ctx.fillRect(
player.x+7,
player.y+10,
20,
15
);



ctx.fillStyle="white";

ctx.font="14px Arial";

ctx.fillText(
"REDPRO",
player.x-5,
player.y-10
);



ctx.restore();



}





function loop(){


if(!game)return;


update();

draw();


requestAnimationFrame(loop);


}



</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Redpro — Игра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Arial, "Helvetica Neue", sans-serif;
    user-select: none;
    background: #2a4a7a;
  }
  
  /* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    background: #1a2a4a;
    border-bottom: 3px solid #0a1428;
    z-index: 100;
  }
  
  /* Вкладка SHOP (жёлтая слева) */
  .shop-tab {
    width: 100px;
    height: 100%;
    background: linear-gradient(180deg, #ffd93d, #e8a000);
    border-right: 3px solid #0a1428;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #5a3a00;
    letter-spacing: 1px;
    cursor: pointer;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  
  /* Профиль */
  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    height: 100%;
    border-right: 3px solid #0a1428;
    min-width: 200px;
  }
  
  .avatar {
    width: 48px; height: 48px;
    background: linear-gradient(180deg, #e5231b, #7a0f0a);
    border: 3px solid #f5a800;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 0 8px rgba(245, 168, 0, 0.6);
  }
  
  .player-name {
    display: flex;
    flex-direction: column;
    line-height: 1.05;
  }
  
  .player-name .label {
    font-size: 10px;
    color: #7a9ad0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
  }
  
  .player-name .value {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }
  
  /* Ресурсы */
  .resources {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    flex: 1;
    height: 100%;
  }
  
  .res {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 5px;
    background: rgba(0,0,0,0.35);
    border: 2px solid #0a1428;
    border-radius: 6px;
    height: 40px;
  }
  
  .res-icon {
    width: 28px; height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    border: 2px solid #fff;
  }
  
  .res-icon.blue { background: linear-gradient(180deg, #4a9eff, #1a5fbf); }
  .res-icon.dark { background: linear-gradient(180deg, #2a3a5a, #0f1a33); }
  .res-icon.gold { background: linear-gradient(180deg, #ffd93d, #d4960a); color: #5a3a00; }
  .res-icon.green { background: linear-gradient(180deg, #6dff6d, #0fa00f); }
  
  .res-value {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
  }
  
  /* Пустые ячейки под ресурсы (как на рисунке) */
  .empty-slots {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
    padding-right: 8px;
  }
  
  .empty-slot {
    width: 44px;
    height: 36px;
    background: rgba(0,0,0,0.35);
    border: 2px solid #0a1428;
    border-radius: 6px;
  }
  
  /* Настройки */
  .settings-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(180deg, #4a9eff, #1a5fbf);
    border: 3px solid #fff;
    border-radius: 6px;
    margin-right: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 3px 0 #0a3a8a;
    transition: transform 0.1s;
    color: #fff;
  }
  .settings-icon:active { transform: translateY(3px); box-shadow: 0 0 0 #0a3a8a; }
  
  /* ============ ЛЕВОЕ МЕНЮ ============ */
  .sidebar {
    position: fixed;
    top: 64px; left: 0; bottom: 0;
    width: 100px;
    background: #1a2a4a;
    border-right: 3px solid #0a1428;
    display: flex;
    flex-direction: column;
    z-index: 90;
  }
  
  .side-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid #0a1428;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    padding: 8px 4px;
    line-height: 1.1;
    transition: filter 0.1s;
    position: relative;
  }
  
  .side-btn:active { filter: brightness(0.8); }
  
  .side-btn.yellow { background: #ffd93d; color: #5a3a00; }
  .side-btn.darkgray { background: #3a3a3a; }
  .side-btn.blue { background: #4a7dff; }
  .side-btn.dark { background: #2a2a2a; }
  
  /* ============ ГЛАВНАЯ ОБЛАСТЬ ============ */
  .main {
    position: fixed;
    top: 64px;
    left: 100px;
    right: 0;
    bottom: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  
  /* Верхний блок: режимы + превью + PLAY */
  .battle-area {
    display: grid;
    grid-template-columns: 90px 1fr 220px;
    gap: 0;
    border: 3px solid #0a1428;
    border-radius: 4px;
    overflow: hidden;
    flex: 1;
    min-height: 0;
    background: #0a1428;
    box-shadow: 0 6px 0 rgba(0,0,0,0.5);
  }
  
  /* Режимы */
  .modes {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: #0a1428;
  }
  
  .mode-btn {
    flex: 1;
    border-bottom: 3px solid #0a1428;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    line-height: 1.1;
    padding: 6px 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: filter 0.1s;
  }
  
  .mode-btn:last-child { border-bottom: none; }
  .mode-btn:active { filter: brightness(0.8); }
  
  .mode-btn.solo { background: linear-gradient(180deg, #b855f7, #7a1fbf); }
  .mode-btn.football { background: linear-gradient(180deg, #4a7dff, #1a3a99); }
  .mode-btn.boss { background: linear-gradient(180deg, #4aa8e8, #1a6fbf); }
  .mode-btn.zone { background: linear-gradient(180deg, #e5231b, #8a0f18); }
  
  /* Красное превью боя */
  .battle-preview {
    background: #d42020;
    border-left: 3px solid #0a1428;
    border-right: 3px solid #0a1428;
    position: relative;
  }
  
  /* Правая колонка */
  .battle-right {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: #2a2a2a;
  }
  
  /* Прогресс-бар сверху */
  .progress-bar {
    height: 60px;
    padding: 10px;
    display: flex;
    align-items: center;
    border-bottom: 3px solid #0a1428;
  }
  
  .progress-track {
    flex: 1;
    height: 32px;
    background: #0a1428;
    border: 3px solid #1a2a4a;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    width: 55%;
    background: linear-gradient(180deg, #5ce4ff, #1a8fbf);
    border-radius: 3px;
  }
  
  .progress-hex {
    position: absolute;
    left: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    background: #5ce4ff;
    border: 3px solid #0a1428;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 2;
  }
  
  /* PLAY */
  .play-btn {
    flex: 1;
    background: linear-gradient(180deg, #ffd93d, #e8a000);
    border-bottom: 3px solid #0a1428;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 900;
    color: #5a3a00;
    cursor: pointer;
    letter-spacing: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    transition: filter 0.1s;
    min-height: 0;
  }
  
  .play-btn:active { filter: brightness(0.85); }
  
  /* КОМАНДА */
  .team-btn {
    height: 50px;
    background: linear-gradient(180deg, #4aa8e8, #1a6fbf);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: filter 0.1s;
  }
  
  .team-btn:active { filter: brightness(0.85); }
  
  /* Нижние панели */
  .bottom-panels {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1fr;
    gap: 10px;
    height: 90px;
    flex-shrink: 0;
  }
  
  .panel {
    border: 3px solid #0a1428;
    border-radius: 4px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.1s, transform 0.1s;
  }
  
  .panel:active { transform: translateY(3px); filter: brightness(0.85); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  
  .panel.blue { background: linear-gradient(180deg, #4a7dff, #1a3a99); }
  .panel.yellow { background: linear-gradient(180deg, #ffd93d, #e8a000); color: #5a3a00; }
  .panel.darkblue { background: linear-gradient(180deg, #3a6fd0, #1a4a99); }
  
  /* Декор справа (шестиугольник) */
  .right-decor {
    position: fixed;
    right: -40px;
    top: 40%;
    width: 100px;
    height: 200px;
    background: linear-gradient(180deg, #4a9eff, #1a5fbf);
    clip-path: polygon(100% 0%, 100% 100%, 0% 90%, 0% 10%);
    z-index: 80;
    border: 3px solid #0a1428;
  }
  
  /* Уведомление */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    border: 3px solid #4a9eff;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
    pointer-events: none;
    letter-spacing: 0.5px;
  }
  
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div class="topbar">
    <div class="shop-tab" onclick="toast('Магазин')">Shop</div>
    
    <div class="profile">
      <div class="avatar">R</div>
      <div class="player-name">
        <div class="label">Имя</div>
        <div class="value">REDPRO</div>
      </div>
    </div>
    
    <div class="resources">
      <div class="res">
        <div class="res-icon blue">📖</div>
        <div class="res-value">0</div>
      </div>
      <div class="res">
        <div class="res-icon green">●</div>
        <div class="res-value">0</div>
      </div>
    </div>
    
    <div class="empty-slots">
      <div class="empty-slot"></div>
      <div class="empty-slot"></div>
      <div class="empty-slot"></div>
    </div>
    
    <div class="settings-icon" onclick="toast('Настройки')">⚙</div>
  </div>

  <!-- ЛЕВОЕ МЕНЮ -->
  <div class="sidebar">
    <div class="side-btn yellow" onclick="toast('Магазин')">Shop</div>
    <div class="side-btn darkgray" onclick="toast('Бойцы')">Бойцы</div>
    <div class="side-btn blue" onclick="toast('Бой')">Бой</div>
    <div class="side-btn dark" onclick="toast('Клан')">Клан</div>
  </div>

  <!-- Декор справа -->
  <div class="right-decor"></div>

  <!-- ГЛАВНАЯ -->
  <div class="main">
    
    <div class="battle-area">
      
      <!-- Режимы -->
      <div class="modes">
        <div class="mode-btn solo" onclick="selectMode(this, 'Соло ШД')">СОЛО-<br>ШД</div>
        <div class="mode-btn football" onclick="selectMode(this, 'Футбол')">ФУТ-<br>БОЛ</div>
        <div class="mode-btn boss" onclick="selectMode(this, 'Босс')">БОСС</div>
        <div class="mode-btn zone" onclick="selectMode(this, 'Захват зоны')">ЗАХ-<br>ВАТ<br>ЗОНЫ</div>
      </div>
      
      <!-- Красное поле -->
      <div class="battle-preview"></div>
      
      <!-- Правая колонка -->
      <div class="battle-right">
        <div class="progress-bar">
          <div class="progress-track">
            <div class="progress-hex"></div>
            <div class="progress-fill"></div>
          </div>
        </div>
        <div class="play-btn" onclick="startGame()">PLAY</div>
        <div class="team-btn" onclick="toast('Команда')">КОМАНДА</div>
      </div>
      
    </div>
    
    <!-- Нижние панели -->
    <div class="bottom-panels">
      <div class="panel blue" onclick="toast('Скоро')">Панель 1</div>
      <div class="panel yellow" onclick="toast('Скоро')">Панель 2</div>
      <div class="panel darkblue" onclick="toast('Скоро')">Панель 3</div>
    </div>
    
  </div>

  <div class="toast" id="toast"></div>

<script>
  let currentMode = 'Соло ШД';
  
  function selectMode(el, mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.style.outline = 'none');
    el.style.outline = '4px solid #ffd93d';
    el.style.outlineOffset = '-4px';
    currentMode = mode;
    toast('Режим: ' + mode);
  }
  
  function startGame() {
    toast('Запуск: ' + currentMode);
  }
  
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
</script>

</body>
</html>
